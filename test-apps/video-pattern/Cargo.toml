[package]
name = "clipped-video-pattern"
description = "A controlled test application that renders a deterministic, machine-verifiable video pattern"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Never published: this is a test subject, not a part of the product. It is a
# workspace member so that `cargo build --workspace` and `cargo clippy
# --workspace --all-targets` hold it to the same standard as everything else -
# a test application that stops compiling is a capture test that stops running
# (AGENTS.md section 26).
publish = false

[[bin]]
name = "video-pattern"
path = "src/main.rs"

# The end-to-end capture test lives in tests/capture/ with the rest of the
# system tests, but belongs to this package: Cargo only sets
# CARGO_BIN_EXE_video-pattern for a test in the package that owns the binary,
# and a test that has to guess at a path under target/ is a test that breaks
# the first time somebody sets --target-dir.
[[test]]
name = "wgc_video_pattern"
path = "../../tests/capture/wgc_video_pattern.rs"

# The audio/video synchronisation measurements, which capture this application
# and the system audio endpoint at the same time: how far the two clocks drift
# apart (issue #22), and — against a run of this application started with
# `--tone` — the absolute offset between the sound and the picture of one event
# (issue #173). Both are docs/av-sync.md. They belong to this package for the
# same reason the test above does — they start this binary — and it is the only
# place in the workspace where `clipped-capture` and `clipped-audio` are held at
# once, which is what measuring the offset between them requires.
[[test]]
name = "av_sync"
path = "../../tests/capture/av_sync.rs"

# The screenshot system test: photograph this application's window through the
# real capture backend, save the file, and read the pattern back out of the
# picture that was saved (issue #67, docs/screenshots.md). It belongs to this
# package for the same reason the two above do — it starts this binary — and it
# is the only place a screenshot is checked against a picture whose contents
# something other than Clipped decided.
[[test]]
name = "screenshot"
path = "../../tests/capture/screenshot.rs"

[dependencies]
# The command-line parser every executable in this workspace uses, so that
# `--help` looks the same wherever a contributor meets it (see the root
# manifest). Dual MIT/Apache-2.0.
clap.workspace = true

# Displays, and the per-monitor DPI mode. Reused rather than reimplemented: this
# application has to place its window on a non-primary display and has to see
# physical pixels to draw a pattern that survives capture, and `clipped-windows`
# already answers both (AGENTS.md section 55).
[target.'cfg(windows)'.dependencies]
clipped-windows.workspace = true

# The window, the Direct3D 11 device and the swap chain the pattern is presented
# through, and — for `--tone` only — the render stream the sound half of the
# subject is played through. The feature list is the honest inventory of what
# src/render.rs, src/app.rs and src/tone.rs name:
#
# - Win32_Foundation               HWND, RECT, BOOL
# - Win32_Graphics_Direct3D        the driver type and feature level
# - Win32_Graphics_Direct3D11      the device, the staging texture, Map/Unmap
# - Win32_Graphics_Dxgi(_Common)   the swap chain, the format, fullscreen
# - Win32_Media_Audio              IAudioClient, IAudioRenderClient, IAudioClock
# - Win32_Media_Multimedia         the IEEE-float subformat a mix format names
# - Win32_System_Com               CoCreateInstance and the multi-threaded apartment
# - Win32_System_Com_StructuredStorage  the PROPVARIANT IMMDevice::Activate takes
# - Win32_System_Console           the Ctrl-C handler that gives a display back
# - Win32_System_LibraryLoader     the module handle a window class needs
# - Win32_System_Performance       the performance counter a tone is placed on
# - Win32_System_Variant           the activation parameter IMMDevice::Activate takes
# - Win32_UI_WindowsAndMessaging   the window, its class and its messages
#
# Dual MIT/Apache-2.0.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }

# tests/capture/wgc_video_pattern.rs captures this application through the real
# Windows Graphics Capture backend and reads the pattern back out of the
# captured textures, and tests/capture/av_sync.rs additionally records the
# system audio endpoint alongside it to measure how far the two clocks drift
# apart. All of it is test-only: the application itself never captures anything,
# and nothing in the product depends on this package
# (tests/integration/tests/workspace_layering.rs).
[target.'cfg(windows)'.dev-dependencies]
clipped-capture.workspace = true
clipped-audio.workspace = true

# tests/capture/screenshot.rs takes a screenshot the way the recorder does —
# `clipped_session::screenshot::capture_still` opens the capture, and
# `clipped_session::screenshot::write` names, encodes and writes the file — so
# that what the test exercises is the product's own path rather than a second
# one written here (AGENTS.md section 55). Test-only, and `clipped-session` is
# layer 4 while this package is layer 6, so it follows the dependency direction
# `tests/integration/tests/workspace_layering.rs` asserts.
clipped-session.workspace = true

# The tone analysis the absolute A/V offset measurement in tests/capture/av_sync.rs
# is built on. `AudioContent::magnitude_at` is the media harness's own Goertzel
# filter over samples already in hand, which is exactly the question the
# detector asks of every two-millisecond window of a capture: how much of the
# subject's tone is in this one. Reused rather than written a third time
# (AGENTS.md section 55) - `crates/audio/tests/system_audio.rs` has the second
# copy, and folding that one in is issue #152. Nothing here runs ffprobe: this
# is the sample-analysis half of the harness, which needs no tools at all.
clipped-media-validation.workspace = true

# `av_sync.rs`'s drift measurement holds a render stream open and hands the audio
# engine buffers marked silent, so that the endpoint's clock keeps running for
# the length of the run — loopback capture delivers nothing at all while the
# endpoint is idle, and a period the device never described has no position to
# measure against. (Its absolute measurement needs no such thing: the subject's
# own `--tone` render stream keeps the endpoint awake.) It opens that stream
# through `src/render_stream.rs`, which is this package's own library and needs
# no dependency of its own — which is why there is no second `windows` entry
# here naming the same namespaces `src/tone.rs` does (AGENTS.md section 55).

[lints]
workspace = true
