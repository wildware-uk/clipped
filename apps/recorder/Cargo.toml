[package]
name = "clipped-recorder"
description = "The Clipped recording process, which runs independently of the desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The library target holds everything the binary does; `main.rs` is only an
# entry point. It exists so that the command line can be tested through its own
# types rather than only by spawning a process, and so that the Ctrl+C fixture
# under `examples/` can install the same shutdown handler the recorder installs.
# It is not a stable public API: see the note in `src/lib.rs`.
[lib]
name = "clipped_recorder"
path = "src/lib.rs"

[[bin]]
name = "clipped-recorder"
path = "src/main.rs"

[dependencies]
clipped-encoder.workspace = true
# What started, what stopped, and whether it is a game. `watch` waits on the
# process watcher and hands the catalogue to `clipped_session::automatic`, which
# owns the policy between the two; this package is only the loop and the window
# resolution the policy deliberately does not do (docs/sessions.md).
clipped-game-detection.workspace = true
# The protocol the desktop application drives this process through, and the
# named pipe it arrives on (docs/ipc.md, ADR 0002). The messages, the framing
# and the handshake live there so that both ends of the connection use one
# implementation of them; what lives here is the recorder behind it.
clipped-ipc.workspace = true
# The recording library the desktop application reads through this process
# (issue #301, `src/library.rs`). The window may not link it — the workspace
# layering test permits `apps/desktop/src-tauri` exactly one member of this
# workspace, `clipped-ipc` — and it has no file-system permission for
# `library.db` either, so the process that owns the database answers for it
# (ADR 0002, docs/library.md). `clipped-session` already brings this crate in;
# naming it here is what deny.toml's `wildcards = "deny"` asks of a dependency
# this package uses directly.
clipped-library.workspace = true
clipped-logging.workspace = true
clipped-session.workspace = true
# The database file itself: opening it, and the migrations that bring it to this
# build's schema. `clipped-library` says what the rows mean and this says where
# they live, which is the split docs/storage.md draws.
clipped-storage.workspace = true
# Window and monitor enumeration for `list-windows`, and the target selection
# the recorder resolves `--window`, `--process` and `--pid` through. Every
# Windows API call this subcommand makes is behind this crate; none is made
# here (AGENTS.md section 5).
clipped-windows.workspace = true
# Argument parsing, pinned in the root manifest so every Clipped executable
# behaves the same way. Dual MIT/Apache-2.0.
clap.workspace = true
# The logging facade. Diagnostics go through `tracing`; `clipped-logging` only
# decides where they end up (docs/logging.md). MIT.
tracing.workspace = true
# Console control handling. Ctrl+C is a platform signal, and this crate is the
# small, well-established wrapper over `SetConsoleCtrlHandler` on Windows and
# `sigaction` elsewhere. Writing it by hand would put raw Win32 and an unsafe
# block into an application crate for no gain (AGENTS.md sections 5 and 10).
# Dual MIT/Apache-2.0.
ctrlc = "3.4"
# Local date and time, used to name the default output file after the moment
# recording started. Calendar arithmetic and time-zone offsets are exactly the
# kind of thing not to hand-roll. Dual MIT/Apache-2.0.
time = { version = "0.3", default-features = false, features = [
    "std",
    "formatting",
    "local-offset",
    "macros",
] }

# Console control, for the one Win32 call the recorder itself makes:
# `SetConsoleCtrlHandler(NULL, FALSE)`, which re-enables Ctrl+C for a process
# started in a group of its own (`shutdown::allow_ctrl_c`). It is one call with
# no pointer in it, in the module that owns the shutdown behaviour, which is
# where AGENTS.md section 5 allows platform code to live when it belongs to the
# crate rather than to the platform layer. Dual MIT/Apache-2.0.
#
# `Win32_System_Registry` is the other one: `start-at-login` writes a single
# value under HKEY_CURRENT_USER, and the six registry calls that read, write and
# remove it live in `start_at_login::platform` rather than being spread about
# (AGENTS.md section 5).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Registry",
] }

# `tests/ctrl_c.rs` delivers a real Ctrl+C to a real child process, which needs
# `GenerateConsoleCtrlEvent` and `AllocConsole` as well.
#
# `tests/supervision.rs` needs `Win32_System_Threading` for the other half of
# the same idea: a recorder started by a fixture is this test's *grandchild* and
# is deliberately detached from it, so there is no `Child` to call `kill` on and
# `OpenProcess`/`TerminateProcess` is how it is ended — and
# `GetExitCodeProcess` is how "did it survive?" is answered rather than assumed.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

# What the recordings this binary produces are checked with: the container
# opens, the video stream is the one that was asked for, the duration is
# plausible and the timestamps increase (AGENTS.md section 22, docs/testing.md).
[dev-dependencies]
clipped-media-validation.workspace = true
# `tests/ipc_protocol.rs` sends parameters that `clipped_ipc::Command` cannot
# express - an unknown command's, and a malformed one's - which is how the
# rejection paths are exercised against a real recorder rather than a mock of
# one. Taken from the workspace for the reason every other crate takes it there.
serde_json.workspace = true

[lints]
workspace = true
