[package]
name = "clipped-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MPL-2.0"
repository = "https://github.com/wildware-uk/clipped"
authors = ["The Clipped contributors"]
description = "The Clipped desktop application: a Tauri window hosting the React interface."
publish = false

# This crate is deliberately NOT a member of the repository's Cargo workspace,
# and an empty `[workspace]` table is what detaches it.
#
# `tauri-build` fails the build when `frontendDist` does not exist, and
# `frontendDist` is `../dist` - the output of `npm run build`. A workspace member
# would therefore make `cargo build --workspace` depend on a prior `npm install`
# and `npm run build`, breaking the promise CONTRIBUTING.md makes about a clean
# clone: a Rust toolchain, the MSVC build tools, LLVM and one run of
# scripts/fetch-ffmpeg.ps1 are enough. It would also put a WebView2 dependency
# and several hundred crates in front of every `cargo test --workspace`, for a
# crate that no other crate may depend on (docs/architecture.md).
#
# The cost of detaching is that `cargo fmt --all`, `cargo clippy --workspace`,
# `cargo build --workspace` and `cargo deny` do not reach this crate, and this
# is much the larger of the two lockfiles: 429 packages against the root's 113.
# Each of those checks is paid back explicitly in .github/workflows/ci.yml
# rather than dropped - the Desktop UI job formats, lints and builds this crate,
# and the Dependencies job runs `cargo deny` against this manifest with the
# repository's one deny.toml. Detaching a crate must not be a way for several
# hundred dependencies to stop being asked about their licences and advisories.
[workspace]

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

[build-dependencies]
# Generates the Windows resources, the application manifest and the permission
# schemas the runtime reads. Dual MIT/Apache-2.0.
tauri-build = { version = "2", features = [] }

[dependencies]
# The window, the WebView2 host and the asset protocol that serves the built
# interface. Dual MIT/Apache-2.0.
#
# `tray-icon` is what puts Clipped in the notification area (SPEC.md section 33,
# issue #50). It is a Cargo feature rather than a separate crate because Tauri
# owns the message loop the tray's window procedure runs on, and a second tray
# implementation beside it would need a second one. The feature brings in
# `tray-icon` and `muda`, which are Tauri's own; among other things `tray-icon`
# is what re-adds the icon when Explorer restarts, by listening for the
# `TaskbarCreated` message every application has to handle for itself.
tauri = { version = "2", features = ["tray-icon"] }
# Opening a file in whatever application the user has chosen for it, and showing
# one in Explorer with it selected (issue #399). Tauri's own plugin, dual
# MIT/Apache-2.0.
#
# Written by hand instead, this would be `ShellExecuteW` and
# `SHOpenFolderAndSelectItems` — the second of which needs COM initialised on
# the calling thread and an item identifier list built and freed correctly — so
# it is a page of `unsafe` in the process that draws the window, to do something
# a maintained plugin already does on three platforms (AGENTS.md section 10).
#
# It is used from **Rust only**, inside the two commands in `src/main.rs`, and
# deliberately: reaching it from the interface would mean granting the window
# `opener:allow-open-path` over a scope, and the only scope that would work is
# every path, because a recording lives wherever the recorder's output directory
# points. A Tauri command instead means the window can ask this process to open
# a file and nothing else, and `capabilities/default.json` grows by nothing
# (`src/main.rs`, "What the window can ask this process to do").
tauri-plugin-opener = "2"
# The native Save As dialog an export's destination is chosen through (issue
# #399) and the folder picker a recording directory is chosen through (issue
# #51). Tauri's own plugin, dual MIT/Apache-2.0.
#
# The one plugin the interface calls directly, which is why
# `capabilities/default.json` gains `dialog:allow-save` and `dialog:allow-open`
# and nothing else. Those permissions are exactly what it needs: the window may
# ask the operating system to show a dialog, and what comes back is a path the
# person in front of the machine typed or chose. Neither grants file-system
# access — the window still cannot read, write or list anything — and what
# happens at those paths is the recorder's: it refuses an export destination
# that already exists (AGENTS.md section 56), and it is what writes into the
# recording directory.
#
# It brings `tauri-plugin-fs` in as a Rust dependency, which it uses to widen
# that plugin's scope to a file the user picked *when that plugin is
# registered*. It is not registered here, so none of its commands exist in this
# build's invoke handler, and `capabilities/default.json` grants none of its
# permissions either — two independent reasons the window still cannot read or
# write a file (`src/playbackReach.test.ts` asserts the second).
tauri-plugin-dialog = "2"
# The recorder control protocol and the supervision built on it: the named pipe,
# the handshake, and deciding whether a recorder is running
# (docs/ipc.md, docs/adr/0006-recorder-lifetime-and-supervision.md).
#
# This is the one crate of the repository's workspace this manifest may name,
# and `tests/integration/tests/workspace_layering.rs` enforces both halves of
# that: nothing else here, and `clipped-ipc` itself depending on no other crate
# of that workspace. A webview cannot open a named pipe, so the Tauri host has
# to be the protocol's client — and the alternative to linking this is a second
# implementation of the handshake, the framing and the compatibility policy
# inside the window, which is the duplication AGENTS.md section 55 exists to
# prevent, of the one surface where the two halves disagreeing is a user-visible
# bug.
#
# The path is what cargo resolves — this crate is not published, and the two
# move together in one repository — and the version is stated beside it because
# deny.toml sets `wildcards = "deny"`: a dependency with no version requirement
# is a dependency nobody can tell the age of from a manifest. Every internal
# dependency in the root workspace carries the same pair. MPL-2.0, like the rest
# of Clipped.
clipped-ipc = { path = "../../../crates/ipc", version = "0.1.0" }
# Microsoft's generated bindings to the Windows API, for one thing this crate
# cannot get from Tauri: which window the user was last looking at.
#
# The tray's Start Recording has to name something to record, and the recorder's
# `start_recording` takes a window, a process name or a process identifier. The
# honest answer for a tray is "the application you were in when you opened this
# menu", and the only way to know that is `EVENT_SYSTEM_FOREGROUND` — a window
# event hook, which costs nothing until a foreground window changes and is the
# non-polling half of the same choice `clipped-game-detection` made for process
# starts (issue #41). Without it the menu item would have to be permanently
# disabled, and a control that can never do anything is one that should not be
# drawn.
#
# `clipped-windows` in the repository's workspace does the same sort of thing
# and is deliberately *not* used: `tests/integration/tests/workspace_layering.rs`
# allows this manifest exactly one member of that workspace, `clipped-ipc`, so
# that closing this window can never reach capture or encoding. The version is
# the one the root workspace pins, so a machine with both checkouts built
# compiles one copy of it. Dual MIT/Apache-2.0.
#
# `Win32_System_Diagnostics_ToolHelp` is the process table, and it is here for
# one question: which processes are Clipped (`src/this_application.rs`, issue
# #390). The interface in this window is drawn by WebView2, in
# `msedgewebview2.exe` processes this one starts, and those have top-level
# windows of their own — so "do not offer to record ourselves" cannot be
# answered by comparing process identifiers with this one's, and must not be
# answered by matching an executable's name, which would refuse every other
# application that hosts a webview. Parentage answers it, and the process table
# is where parentage is.
#
# `Data_Xml_Dom` and `UI_Notifications` are the Windows toast a notification is
# (issue #110, `src/toast.rs`), and `Foundation` is the event handler its button
# is delivered through. Neither `tauri-plugin-notification` nor the
# `tauri-winrt-notification` crate beneath it can be used for this:
#
# - the plugin's desktop `show()` is `let _ = notification.show()`, and it
#   offers neither a button nor an activation handler on Windows. A notification
#   with nothing to do about it is the message AGENTS.md section 45 exists to
#   prevent, and one that fails in silence is section 15;
# - the crate's `Toast::show` builds the `ToastNotification`, attaches the
#   `Activated` handler, shows it and returns `Result<()>` — dropping the object
#   the handler is attached to, and giving the caller no way to hold it. Clipped
#   has to keep it, or its button may have no handler left to run when it is
#   clicked (`src/toast.rs`).
#
# The alternative to these two features is a fork of that crate, for the sake of
# thirty lines of XML document building this crate can hold itself.
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    # The clock a process creation time is expressed against, which is what the
    # process table is judged by: an identifier recycled between the table being
    # read and a process being opened has to be told from the process the table
    # described (`src/this_application.rs`, issue #390).
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }
# The notification settings file: which categories the user wants. `serde` comes
# with Tauri either way; naming both here is what deny.toml's `wildcards =
# "deny"` asks of a dependency this crate actually uses. Dual MIT/Apache-2.0.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Tauri's own mock runtime, which is the only way to obtain the
# `tauri::State<'_, RecorderLink>` a `#[tauri::command]` is handed: `State` has
# no public constructor, so a command that takes one can otherwise be tested
# only through a real window.
#
# The seam this is for is the middle hop of every round trip the window makes —
# window → Tauri command → control protocol → recorder. The TypeScript tests stub
# `invoke`, so they stop at the window's edge; the recorder's own tests start at
# its dispatch. Without this the commands in `main.rs` that join them are covered
# by nothing at all: a `library_sessions` that sent `Command::LibraryGames` and
# dropped every parameter (issue #301), or a `start_recording` that sent
# `Command::TakeScreenshot` and dropped the process identifier (issue #389),
# would each pass the whole suite.
#
# It opens no window: `mock_builder` builds an application on `MockRuntime`, and
# these tests never ask it for a webview. The feature is only ever enabled for
# test targets — Cargo's v2 resolver, which edition 2021 selects, does not unify
# dev-dependency features into a normal build — so a release build of the window
# links none of it. Dual MIT/Apache-2.0, the same crate as above.
tauri = { version = "2", features = ["test"] }
