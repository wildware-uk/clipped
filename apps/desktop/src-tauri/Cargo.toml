[package]
name = "clipped-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MPL-2.0"
repository = "https://github.com/wildware-uk/clipped"
authors = ["The Clipped contributors"]
description = "The Clipped desktop application: a Tauri window hosting the React interface."
publish = false

# This crate is deliberately NOT a member of the repository's Cargo workspace,
# and an empty `[workspace]` table is what detaches it.
#
# `tauri-build` fails the build when `frontendDist` does not exist, and
# `frontendDist` is `../dist` - the output of `npm run build`. A workspace member
# would therefore make `cargo build --workspace` depend on a prior `npm install`
# and `npm run build`, breaking the promise CONTRIBUTING.md makes about a clean
# clone: a Rust toolchain, the MSVC build tools, LLVM and one run of
# scripts/fetch-ffmpeg.ps1 are enough. It would also put a WebView2 dependency
# and several hundred crates in front of every `cargo test --workspace`, for a
# crate that no other crate may depend on (docs/architecture.md).
#
# The cost of detaching is that `cargo fmt --all`, `cargo clippy --workspace`,
# `cargo build --workspace` and `cargo deny` do not reach this crate, and this
# is much the larger of the two lockfiles: 429 packages against the root's 113.
# Each of those checks is paid back explicitly in .github/workflows/ci.yml
# rather than dropped - the Desktop UI job formats, lints and builds this crate,
# and the Dependencies job runs `cargo deny` against this manifest with the
# repository's one deny.toml. Detaching a crate must not be a way for several
# hundred dependencies to stop being asked about their licences and advisories.
[workspace]

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

[build-dependencies]
# Generates the Windows resources, the application manifest and the permission
# schemas the runtime reads. Dual MIT/Apache-2.0.
tauri-build = { version = "2", features = [] }

[dependencies]
# The window, the WebView2 host and the asset protocol that serves the built
# interface. Dual MIT/Apache-2.0.
#
# `tray-icon` is what puts Clipped in the notification area (SPEC.md section 33,
# issue #50). It is a Cargo feature rather than a separate crate because Tauri
# owns the message loop the tray's window procedure runs on, and a second tray
# implementation beside it would need a second one. The feature brings in
# `tray-icon` and `muda`, which are Tauri's own; among other things `tray-icon`
# is what re-adds the icon when Explorer restarts, by listening for the
# `TaskbarCreated` message every application has to handle for itself.
tauri = { version = "2", features = ["tray-icon"] }
# The recorder control protocol and the supervision built on it: the named pipe,
# the handshake, and deciding whether a recorder is running
# (docs/ipc.md, docs/adr/0006-recorder-lifetime-and-supervision.md).
#
# This is the one crate of the repository's workspace this manifest may name,
# and `tests/integration/tests/workspace_layering.rs` enforces both halves of
# that: nothing else here, and `clipped-ipc` itself depending on no other crate
# of that workspace. A webview cannot open a named pipe, so the Tauri host has
# to be the protocol's client — and the alternative to linking this is a second
# implementation of the handshake, the framing and the compatibility policy
# inside the window, which is the duplication AGENTS.md section 55 exists to
# prevent, of the one surface where the two halves disagreeing is a user-visible
# bug.
#
# The path is what cargo resolves — this crate is not published, and the two
# move together in one repository — and the version is stated beside it because
# deny.toml sets `wildcards = "deny"`: a dependency with no version requirement
# is a dependency nobody can tell the age of from a manifest. Every internal
# dependency in the root workspace carries the same pair. MPL-2.0, like the rest
# of Clipped.
clipped-ipc = { path = "../../../crates/ipc", version = "0.1.0" }
# Microsoft's generated bindings to the Windows API, for one thing this crate
# cannot get from Tauri: which window the user was last looking at.
#
# The tray's Start Recording has to name something to record, and the recorder's
# `start_recording` takes a window, a process name or a process identifier. The
# honest answer for a tray is "the application you were in when you opened this
# menu", and the only way to know that is `EVENT_SYSTEM_FOREGROUND` — a window
# event hook, which costs nothing until a foreground window changes and is the
# non-polling half of the same choice `clipped-game-detection` made for process
# starts (issue #41). Without it the menu item would have to be permanently
# disabled, and a control that can never do anything is one that should not be
# drawn.
#
# `clipped-windows` in the repository's workspace does the same sort of thing
# and is deliberately *not* used: `tests/integration/tests/workspace_layering.rs`
# allows this manifest exactly one member of that workspace, `clipped-ipc`, so
# that closing this window can never reach capture or encoding. The version is
# the one the root workspace pins, so a machine with both checkouts built
# compiles one copy of it. Dual MIT/Apache-2.0.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }
# The Windows toast a notification is (issue #110). Tauri's own crate, and the
# one `tauri-plugin-notification` is built on — used directly rather than
# through the plugin for two reasons, both of which the plugin's `show()` makes
# unavoidable: it is `let _ = notification.show()`, so a toast that could not be
# delivered is discarded silently, and it offers neither a button nor an
# activation handler on Windows. A notification with nothing to do about it is
# the message AGENTS.md section 45 exists to prevent, and one that fails in
# silence is section 15. Dual MIT/Apache-2.0.
tauri-winrt-notification = "0.8"
# The notification settings file: which categories the user wants. `serde` comes
# with Tauri either way; naming both here is what deny.toml's `wildcards =
# "deny"` asks of a dependency this crate actually uses. Dual MIT/Apache-2.0.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
