[workspace]
resolver = "2"
# `test-apps/*` are the controlled subjects capture tests point at instead of an
# installed game (AGENTS.md section 26, docs/testing.md). They are workspace
# members, and not a separate workspace, so that `cargo fmt`, `cargo clippy
# --workspace --all-targets` and `cargo build --workspace` cover them: a test
# application nobody compiles is a capture test that stops running, and finding
# that out during a capture investigation is the worst possible moment.
#
# `plugins/*` are the game integrations (docs/plugin-api.md). A plugin is an
# executable a user installs, not a crate anything here links, so it could have
# been a workspace of its own — and it deliberately is not, for the reason the
# test applications are members: `cargo fmt`, `cargo clippy --workspace`,
# `cargo build --workspace`, `cargo test --workspace` and `cargo deny` reach a
# member, and a plugin nobody compiles is an integration that stops working
# without anybody finding out. Nothing in the product may depend on one, which
# `tests/integration/tests/workspace_layering.rs` asserts.
members = [
    "apps/recorder",
    "crates/*",
    "plugins/*",
    "test-apps/*",
    "tests/exclusion",
    "tests/integration",
    "tests/media",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MPL-2.0"
repository = "https://github.com/wildware-uk/clipped"
authors = ["The Clipped contributors"]

# Internal crates are referenced through the workspace so that a version bump
# happens in one place. Layering rules are documented in README.md; a crate must
# only depend on crates listed below it there.
#
# Shared external dependencies are pinned here for the same reason: `tracing` is
# the logging facade every crate is expected to call directly (docs/logging.md),
# so a crate adopts it with `tracing.workspace = true` rather than picking its
# own version and splitting the callsite registry across two copies of the crate.
[workspace.dependencies]
tracing = "0.1"
# The command-line parser, pinned here for the same reason as `tracing`: the
# recorder is not the only executable this workspace will grow — the desktop
# application's sidecar tooling follows in M5 — and every one of them should
# present the same argument syntax, the same `--help` layout and the same exit
# code for a usage error. That only holds if they share one version of clap.
# Dual MIT/Apache-2.0.
clap = { version = "4.5", features = ["derive"] }
# The FFmpeg binding, pinned here rather than in the crate that uses it because
# its version and the prebuilt FFmpeg that scripts/fetch-ffmpeg.ps1 downloads
# have to move together: `0.17.0+ffmpeg.8.1` is the release built and tested
# against the FFmpeg 8.1 headers the fetch script installs, and the `ffmpeg8_1`
# feature is what tells it which FFmpeg API to expect. Every crate that later
# reaches for FFmpeg - the encoder, thumbnails, waveform extraction - uses this
# one entry, so there is a single place to change when the pin moves
# (docs/adr/0004-ffmpeg-dependency-strategy.md).
#
# MIT. It is a raw `-sys` binding: it links FFmpeg and generates the FFI, and
# nothing above that. The safe wrappers live in crates/muxer, deliberately, so
# that the FFmpeg surface Clipped depends on stays small and visible. ADR 0004
# records why the higher-level `ffmpeg-the-third` was rejected - it is WTFPL,
# which deny.toml does not allow - and why `rsmpeg` was too.
#
# FFmpeg itself is LGPL v3 and is not vendored here; it is fetched by
# scripts/fetch-ffmpeg.ps1 and linked dynamically.
rusty_ffmpeg = { version = "0.17.0", features = ["ffmpeg8_1"] }
# Serialisation, pinned here because more than one crate will persist state:
# the encoder capability cache today, the recording library and per-game
# settings later. Two copies of serde in one binary means two derive macros and
# two versions of every trait, so a crate takes it from here. Dual MIT/Apache-2.0.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Calendar dates and calendar arithmetic. Pinned here because two crates now
# need the same calendar: `clipped-session` names a recording after the moment
# it started, and `clipped-library` compares the day a `date:` term asks for
# against the day a row belongs to (docs/search.md). Those two have to agree on
# what a date is — a session's file name and a search for that day are the same
# day — and they only do if there is one `time::Date` rather than two crates'
# worth of leap-year rules. Each crate still chooses its own `features`; the
# base entry is `default-features = false` so that a crate pays only for what it
# names. Dual MIT/Apache-2.0.
time = { version = "0.3", default-features = false }
# Microsoft's generated bindings to the Windows API, pinned here for a reason
# specific to them: more than one crate has to reach Windows — `clipped-windows`
# enumerates windows and monitors today, and capture, audio and encoding each
# need their own slice of the API later — and two versions of `windows` in one
# binary means two incompatible `HWND` types and two copies of the COM plumbing,
# which produces type errors a contributor has no way to interpret. Each crate
# still chooses its own `features`, because the crate is enormous and only the
# namespaces a crate names are compiled.
#
# This was `default-features = false`, so that a crate pays only for the
# headers it actually calls, but `clipped-windows` needs the default `std`
# feature for `windows_result::Error` to implement `std::error::Error` (its
# `RunError`/`ListWindowsError` sources depend on that), and disabling
# defaults there broke the build. Plain `"0.62"` it is, until that is worth
# trading for opting individual crates back into `std`.
# Dual MIT/Apache-2.0.
windows = "0.62"
# The COM plumbing `windows` is built on, pinned here rather than in the crate
# that names it for exactly the reason above: it *is* the COM plumbing, and two
# majors of it in one binary is the failure that entry describes. A crate names
# it only when it implements a COM interface rather than only calling them —
# `clipped-audio` does, because `IMMNotificationClient` is how Windows says an
# audio device has gone, and the `#[implement]` macro generates code rooted at
# `::windows_core`. Keep this version in step with `windows` above: `windows
# 0.62` re-exports `windows-core 0.62`, and the two moving separately is what
# produces a second copy. Dual MIT/Apache-2.0.
windows-core = "0.62"

clipped-audio = { path = "crates/audio", version = "0.1.0" }
clipped-background = { path = "crates/background", version = "0.1.0" }
clipped-capture = { path = "crates/capture", version = "0.1.0" }
clipped-edit = { path = "crates/edit", version = "0.1.0" }
clipped-encoder = { path = "crates/encoder", version = "0.1.0" }
clipped-events = { path = "crates/events", version = "0.1.0" }
clipped-export = { path = "crates/export", version = "0.1.0" }
clipped-ffmpeg-runtime = { path = "crates/ffmpeg-runtime", version = "0.1.0" }
clipped-game-detection = { path = "crates/game-detection", version = "0.1.0" }
clipped-hotkeys = { path = "crates/hotkeys", version = "0.1.0" }
clipped-ipc = { path = "crates/ipc", version = "0.1.0" }
clipped-library = { path = "crates/library", version = "0.1.0" }
clipped-logging = { path = "crates/logging", version = "0.1.0" }
clipped-muxer = { path = "crates/muxer", version = "0.1.0" }
clipped-plugins = { path = "crates/plugins", version = "0.1.0" }
clipped-replay = { path = "crates/replay", version = "0.1.0" }
clipped-session = { path = "crates/session", version = "0.1.0" }
clipped-storage = { path = "crates/storage", version = "0.1.0" }
clipped-waveform = { path = "crates/waveform", version = "0.1.0" }
clipped-windows = { path = "crates/windows", version = "0.1.0" }

# The media validation harness (tests/media, docs/testing.md). It is listed
# here with the product crates rather than beside the test applications below
# because the crates that *produce* media take it as a dev-dependency, so it has
# to sit underneath all of them — it depends on nothing in this workspace, and
# nothing but a `[dev-dependencies]` entry may name it.
clipped-test-exclusion = { path = "tests/exclusion" }
clipped-media-validation = { path = "tests/media", version = "0.1.0" }

# The controlled test applications (AGENTS.md section 26, docs/testing.md). They
# are listed here for the same reason the crates above are — one place to change
# a path or a version — and they are deliberately at the bottom: nothing in the
# product may depend on one, which
# `tests/integration/tests/workspace_layering.rs` asserts rather than hopes.
# `clipped-fullscreen-dx11` is not listed because nothing depends on it; it is a
# binary, and it is reached by running it.
clipped-video-pattern = { path = "test-apps/video-pattern", version = "0.1.0" }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

# The recorder runs alongside games, so release builds trade compile time for
# runtime cost. Debug symbols are kept because crash reports from users are the
# only diagnostics available for a locally installed application.
[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
