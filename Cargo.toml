[workspace]
resolver = "2"
members = ["apps/recorder", "crates/*", "tests/integration"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MPL-2.0"
repository = "https://github.com/wildware-uk/clipped"
authors = ["The Clipped contributors"]

# Internal crates are referenced through the workspace so that a version bump
# happens in one place. Layering rules are documented in README.md; a crate must
# only depend on crates listed below it there.
#
# Shared external dependencies are pinned here for the same reason: `tracing` is
# the logging facade every crate is expected to call directly (docs/logging.md),
# so a crate adopts it with `tracing.workspace = true` rather than picking its
# own version and splitting the callsite registry across two copies of the crate.
[workspace.dependencies]
tracing = "0.1"

# The FFmpeg binding is pinned here rather than in the crate that uses it
# because its version and the prebuilt FFmpeg that scripts/fetch-ffmpeg.ps1
# downloads have to move together: `5.0.0+ffmpeg-8.1` is the release built and
# tested against the FFmpeg 8.1 headers the fetch script installs. Every crate
# that later reaches for FFmpeg - the encoder, thumbnails, waveform extraction -
# must use this one entry, so there is a single place to change when the pin
# moves (docs/adr/0004-ffmpeg-dependency-strategy.md).
#
# Default features are off deliberately: they pull in avdevice, avfilter,
# swscale and swresample, none of which anything links against yet. Each crate
# opts into the components it actually uses.
#
# Licence note, as CONTRIBUTING.md asks for when one is unusual: this crate and
# its `ffmpeg-sys-the-third` sys crate are WTFPL. That is permissive to the
# point of imposing nothing at all - not even attribution - and it is
# GPL-compatible and compatible with MPL-2.0, but it is not OSI-approved and it
# carries no warranty disclaimer. It was accepted knowingly, over the MIT
# `rsmpeg`, because `rsmpeg` has been dormant since August 2025 and caps FFmpeg
# at 8.0. ADR 0004 sets out the trade-off and the exit.
#
# FFmpeg itself is LGPL v3 and is not vendored here; it is fetched by
# scripts/fetch-ffmpeg.ps1 and linked dynamically.
ffmpeg-the-third = { version = "5.0.0", default-features = false }

clipped-audio = { path = "crates/audio", version = "0.1.0" }
clipped-capture = { path = "crates/capture", version = "0.1.0" }
clipped-encoder = { path = "crates/encoder", version = "0.1.0" }
clipped-events = { path = "crates/events", version = "0.1.0" }
clipped-game-detection = { path = "crates/game-detection", version = "0.1.0" }
clipped-library = { path = "crates/library", version = "0.1.0" }
clipped-logging = { path = "crates/logging", version = "0.1.0" }
clipped-muxer = { path = "crates/muxer", version = "0.1.0" }
clipped-plugins = { path = "crates/plugins", version = "0.1.0" }
clipped-session = { path = "crates/session", version = "0.1.0" }
clipped-storage = { path = "crates/storage", version = "0.1.0" }
clipped-windows = { path = "crates/windows", version = "0.1.0" }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

# The recorder runs alongside games, so release builds trade compile time for
# runtime cost. Debug symbols are kept because crash reports from users are the
# only diagnostics available for a locally installed application.
[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
