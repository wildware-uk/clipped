[package]
name = "clipped-windows"
description = "Windows platform primitives shared by the capture, audio and encoder crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The Windows API. Pinned in the root manifest so that every crate reaching
# Windows sees the same `HWND` (AGENTS.md section 10). Only the namespaces
# listed here are generated and compiled, so the feature list is the honest
# inventory of what this crate touches:
#
# - Win32_Foundation             HWND, HANDLE, RECT, CloseHandle
# - Win32_UI_WindowsAndMessaging EnumWindows and the window queries around it
# - Win32_UI_HiDpi               per-monitor DPI, and the process DPI mode
# - Win32_Graphics_Gdi           monitors: EnumDisplayMonitors, GetMonitorInfoW
# - Win32_Graphics_Dwm           DWMWA_CLOAKED, which is how a window can be
#                                "visible" and yet show nothing
# - Win32_System_Threading       OpenProcess, and what a process handle answers:
#                                the executable behind a PID, when the process
#                                started, and whether it is still running
# - Win32_System_Diagnostics_ToolHelp
#                                the process table in one call, which is how a
#                                process tree finds children it has not met
# - Win32_System_SystemInformation
#                                the current file time, which is the moment a
#                                process table snapshot is judged against
# - Win32_Storage_FileSystem     GetDiskFreeSpaceExW: how large the volume
#                                holding a path is and how much of it is free.
#                                The recording engine and storage accounting
#                                had a copy each until issue #277
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }

# `tests/desktop.rs` creates real windows to enumerate, which needs the module
# handle to register a window class with. Kept out of the shipped feature list
# because nothing in the library creates a window: this crate observes the
# desktop, it does not add to it.
#
# `tests/foreground.rs` additionally has to *take* the foreground, and Windows
# grants that only to a process that has just produced input — so it synthesises
# a zero-pixel mouse movement first (`docs/testing.md`). Nothing in the library
# synthesises input, and nothing in Clipped may: reading the keyboard is what
# `docs/hotkeys.md` rules out, and this is the opposite direction of the same
# API. It is a dev-dependency for exactly that reason.
# `examples/process_table_apis.rs` measures `NtQuerySystemInformation` against
# the `CreateToolhelp32Snapshot` the library ships with, which is the
# measurement issue #288 is waiting on. It is a dev-dependency because that is
# the whole extent of the dependency: nothing in the library calls into
# `ntdll`, and whether anything ever should is the question the example exists
# to answer.
[dev-dependencies]
windows = { workspace = true, features = [
    "Wdk_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[lints]
workspace = true
