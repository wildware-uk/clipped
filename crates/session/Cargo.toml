[package]
name = "clipped-session"
description = "Recording session coordination across capture, audio, encode and mux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The three halves of a recording, joined here and nowhere else. This crate is
# the only place in the workspace that holds all of them at once, which is the
# whole reason it exists (README, "Dependency direction").
clipped-capture.workspace = true
clipped-encoder.workspace = true
clipped-muxer.workspace = true
# The endpoints a recording's audio tracks come from (#180, `src/audio`). This
# crate is the only one that holds both `clipped-audio` and `clipped-muxer`,
# which is what the dependency table in README.md means by putting the routing
# between two layer-1 subsystems in layer 3: neither of them may depend on the
# other, and the timestamp bridge between them —
# `CaptureClock::media_time_on` — is deliberately something a caller has to name
# a clock for (docs/av-sync.md).
clipped-audio.workspace = true
# The rolling window of encoded segments a replay save is built from
# (docs/replay-buffer.md). This crate is where it attaches, because this is
# where the encoder's packets are drained: the buffer is a second consumer of
# those packets, so a recording and a replay buffer running together encode
# once.
clipped-replay.workspace = true
# What a game is, and what started and stopped. The automatic session manager
# (`src/automatic`) is the policy between those two answers and a recording, and
# this crate is deliberately where that policy lives: `clipped-game-detection`'s
# own documentation says it reports what is running and `clipped-session`
# decides what to do about it. The dependency direction is the one README.md's
# layer table gives — game detection is layer 1, this crate is layer 3 — and
# `tests/integration/tests/workspace_layering.rs` asserts it.
clipped-game-detection.workspace = true
# What happened in a game, and when it happened on the recording's timeline.
# `src/highlights` is the policy over that vocabulary — which events are worth a
# clip and how much of the recording each keeps (#75, docs/highlights.md) — and
# it lives here for the reason README.md's layer table gives: `clipped-events`
# is a layer 0 vocabulary that names no game and holds no rule, and the crate
# that decides what to do about an event is this one. The dependency is on the
# types only; producing events is `clipped-plugins`' and persisting them is
# `clipped-storage`'s.
clipped-events.workspace = true
# The plugin contract, and the supervisor that runs one. `src/plugins.rs` is
# what starts a plugin during a recording (issue #338): `clipped-plugins`
# deliberately starts nothing by itself — its supervisor is a state machine over
# a clock reading its owner supplies — and this crate is the owner, because this
# is where a recording's timeline exists and a plugin's event is a position on
# one. The dependency points down the layer table in README.md: the plugin
# contract is layer 1 and this crate is layer 4.
#
# It is the contract only. The plugins themselves are separate executables under
# `plugins/`, reached by starting a process and never by linking a crate, which
# `tests/integration/tests/workspace_layering.rs` asserts rather than trusts.
clipped-plugins.workspace = true
# What a clip *is* once a rule has decided a moment is worth one:
# `clipped_library::VirtualClip` — an edit document plus the event that caused
# it — and `window_around`, the one conversion from an event's moment to a
# range of a file (`docs/highlights.md`). `src/highlights/generate.rs` is the
# join between the two halves, and this crate is where it belongs: the layer
# table in docs/architecture.md puts the highlight engine's *rules* here, and
# generation is the rule about which source a clip comes from, what it is
# called and whether it already exists. `clipped-library` is layer 1 and this
# crate is layer 4, so the dependency points down; the reverse would put the
# recording engine underneath the media library.
#
# It is a real addition to what `apps/recorder` links — the library brings the
# SQLite binding with it — and it is the direction the recorder was going
# anyway: indexing a session's sidecars into the library index (#56) is the
# recorder's job, not the desktop's, which links `clipped-ipc` and nothing else
# (ADR 0002). Nothing in generation opens a database, a file or a socket.
clipped-library.workspace = true
# The database handle `clipped-library`'s accounting and trash take. `sweep`
# (`src/cleanup.rs`) hands one to `cleanup::candidates` and `cleanup::apply`,
# and naming the type is the only reason this is here: nothing in this crate
# opens a database, prepares a statement or writes a row. `clipped-library`
# does not re-export it and a wrapper here would be a second name for the same
# thing (AGENTS.md section 55). Layer 0, and already linked by anything that
# links the library.
clipped-storage.workspace = true
# The vocabulary a clip's range is written in: `RecordingId` and `SourceSpan`.
# A virtual clip is an edit document, so naming one means naming the document
# model's types; `clipped-library` does not re-export them and a wrapper here
# would be a second name for the same thing (AGENTS.md section 55). Layer 0,
# holds no application logic and performs no I/O.
clipped-edit.workspace = true
# What a hotkey binding is. `src/config` holds the hotkey layer of the
# configuration, because a binding is a setting like any other and the ticket
# that defines the configuration API (#108) names them; the dependency points
# this way because `clipped-hotkeys` is a key combination plus a handler the
# caller supplies (README.md, "Dependency direction"), and a hotkey crate that
# reached back into a session could be linked by neither the recorder nor the
# desktop application.
clipped-hotkeys.workspace = true
# The standard session context — `session_id`, `capture_backend`, `encoder` —
# so that every line a recording produces is searchable by the same fields
# (docs/logging.md). `RedactedPath` keeps the output path out of the logs.
# Which process owns the window being recorded, so a recording's audio can be
# scoped to the game's own process tree rather than to everything the machine
# played (`src/audio`, issues #26 and #27). The call is one line of Win32 and
# `clipped-windows` already made it for its own window enumeration; AGENTS.md
# section 5 puts platform code there and section 55 forbids the second copy, so
# this crate names that one rather than reaching for `GetWindowThreadProcessId`
# itself. Layer 0, so the direction is the one README.md's table allows.
#
# And how much room is left on the drive a recording is being written to
# (`volume_free_space`, `src/disk.rs`, #277). `clipped-library` asks the same
# question of the same API for storage accounting, and this crate reaching for
# the library to ask it would put the SQLite index underneath a recording's
# stop condition (ADR 0002).
clipped-windows.workspace = true
clipped-logging.workspace = true
tracing.workspace = true
# The raw FFmpeg FFI, for `src/screenshot`. A screenshot is one captured frame
# encoded as a PNG, a JPEG or a lossless WebP (SPEC.md section 26), and there is
# no lower-layer route to any of those: `clipped-muxer` wraps the *container*
# API and knows nothing about still images, and `clipped-encoder` opens hardware
# video encoders. `docs/adr/0004-ffmpeg-dependency-strategy.md` permits exactly
# this in the amendment issue #155 added — a crate with no lower-layer route to
# what it needs may name the binding — as `crates/library` already does for
# thumbnails, which is the same job on a decoded frame instead of a captured
# one.
#
# It adds no runtime cost to a recording: nothing here is loaded or called until
# somebody takes a screenshot, and this crate's dependents already import the
# same FFmpeg libraries through `clipped-muxer`. MIT.
rusty_ffmpeg.workspace = true
# A session's record on disk (`src/automatic/sidecar.rs`, docs/sessions.md).
# It is a documented sidecar rather than a second database: M6's issue #55 owns
# the SQLite library index, and arriving at a second persistence mechanism by
# accident is what AGENTS.md section 55 exists to prevent. Both are taken from
# the workspace for the reason the root manifest gives.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Calendar arithmetic, for the one thing a session needs it for: naming itself
# after the moment it started, in the same `[year][month][day]-[hour][minute]
# [second]` form `clipped-recorder record` already names its files in. Working
# a date out of a Unix timestamp by hand is exactly the kind of thing not to
# hand-roll, and `apps/recorder` already depends on this crate for the same
# reason. Taken from the workspace, which says why the version is pinned there.
time = { workspace = true, features = [
    "std",
    "formatting",
    "local-offset",
    "macros",
] }

# One Windows call, and only one.
#
# `ID3D11Texture2D::GetDevice` is how a session finds the device a captured
# frame lives on so that it can open an encoder against the same one.
# `clipped-capture` owns its device privately and hands out only textures, and
# asking a texture which device it belongs to is both the documented way to
# answer that and the way `crates/capture`'s own tests do it. Anything else
# would mean a second device and a cross-adapter copy of every frame.
#
# There were two until #277. `GetDiskFreeSpaceExW` — how a recording knows to
# stop before the drive it is writing to fills up, which is what keeps the
# *trailer* from being the write that fails (#103, `src/disk.rs`) —
# `clipped-library` made for storage accounting as well, and both copies moved
# to `clipped_windows::volume_free_space`.
#
# The feature list is exactly what `src/windows/` names. Dual MIT/Apache-2.0.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Graphics_Direct3D11",
] }

# The two plugins `src/plugins/tests.rs` runs, compiled from
# `crates/plugins`' own example sources rather than copied here.
#
# A test of this crate's plugin wiring has to have a real plugin process to
# point at: a fake that pretends to hang would only prove the pretence was
# ignored (AGENTS.md section 54). Those two programs already exist, and the one
# thing that cannot be done is take them from `clipped-plugins` at run time —
# Cargo builds a dependency's library and never its examples, so a test relying
# on `target/<profile>/examples/misbehaving_plugin` would pass under `cargo test
# --workspace` and fail under `cargo test -p clipped-session`.
#
# Naming the same source files as examples of this package is what avoids a
# second copy of both (AGENTS.md section 55): `cargo test -p clipped-session`
# builds them, they land beside this crate's own test binaries, and there is
# still exactly one `misbehaving_plugin.rs` in the repository. It is the same
# arrangement `test-apps/video-pattern` uses in the other direction, where the
# `[[test]]` entries name files under `tests/capture/`.
[[example]]
name = "misbehaving_plugin"
path = "../plugins/examples/misbehaving_plugin.rs"

[[example]]
name = "example_plugin"
path = "../plugins/examples/example_plugin.rs"

# Creating a device and a texture is a test concern, and only a test concern.
# The recording engine is handed both by the capture backend and asks a texture
# which device it belongs to; nothing it ships creates either. What needs the
# rest of Direct3D is `src/recording.rs`'s test of the capture loop, which drives
# the loop against a scripted backend that has to hand over a frame that is a
# real frame — a texture the encoder can be opened against and a device
# `FrameDevice::of` can answer for. WARP is what lets that run on a machine with
# no usable GPU, which is every hosted CI runner.
#
# Declaring these here rather than widening the dependency above means the
# shipped recorder does not compile a line of device creation on account of this
# crate, which is the arrangement `crates/encoder` already uses for the same
# reason.
[target.'cfg(windows)'.dev-dependencies.windows]
workspace = true
features = [
    # `D3D11CreateDevice` and the texture description the test fills in.
    "Win32_Graphics_Direct3D11",
    # `D3D_DRIVER_TYPE_HARDWARE`, `D3D_DRIVER_TYPE_WARP` and the feature level,
    # which `D3D11CreateDevice` takes.
    "Win32_Graphics_Direct3D",
    # `DXGI_FORMAT_B8G8R8A8_UNORM` and `DXGI_SAMPLE_DESC`, which the texture is
    # described in — the format `PixelFormat::Bgra8Unorm` names.
    "Win32_Graphics_Dxgi_Common",
    # `CreateWindowExW` and `DestroyWindow`, for one off-screen window of the
    # `STATIC` class that is never shown. `src/audio/tests.rs` needs a window
    # this process really owns, because which audio sources a recording opens
    # depends on `CaptureTargetSettings::game_process`, and that is
    # `GetWindowThreadProcessId` of a real handle — a fabricated one plans a
    # whole-endpoint recording and measures nothing (issue #581).
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
# `examples/replay_probe.rs` takes command-line arguments, and every executable
# in this workspace presents the same argument syntax and the same usage errors
# (the root manifest says why).
clap.workspace = true
# AGENTS.md section 22: a recording this crate produced is inspected with
# `ffprobe` rather than taken on trust. `src/audio/tests.rs` drives the real
# muxing thread over scripted captures and asserts on the file that comes out —
# the streams, their codec, sampling rate and channel count, and how far apart
# the tracks are.
clipped-media-validation.workspace = true

[lints]
workspace = true
