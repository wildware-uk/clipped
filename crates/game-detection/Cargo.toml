[package]
name = "clipped-game-detection"
description = "Detection of running games and their launchers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The game catalogue is data, not code: a contributor adds a game by editing
# `data/games.toml` and opening a pull request, and a user adds one by editing
# a file in their own data directory (docs/game-detection.md). Both files are
# TOML, so this crate needs a TOML parser.
#
# Why TOML rather than the JSON `serde_json` already pinned in the workspace,
# given that adding a dependency should need a reason (AGENTS.md section 10):
#
#   - The seed file is meant to be *read* in a pull request diff. TOML's
#     `[[game]]` blocks put one entry per stanza with no closing punctuation, so
#     adding an entry is an addition of contiguous lines rather than a change to
#     the line above it. JSON's trailing comma makes every insertion a two-line
#     diff and every entry's last line a merge conflict for the next contributor.
#   - It has comments. Half of what a catalogue entry needs to say is *why* —
#     why an executable is path-qualified, what a launcher's identifier refers
#     to, what has and has not been verified about a game's capture. JSON cannot
#     carry any of it, and a `_comment` key is a worse version of a comment.
#   - Its parse errors carry a line and column. A malformed entry has to fail
#     loudly and say where (issue #42), and that is much of the message for free.
#
# The cost is one more parser in the tree; `serde_json` stays where it is for
# the encoder cache and the IPC protocol, which are machine-written files where
# none of the three reasons above applies.
#
# Dual MIT/Apache-2.0.
toml = "1.1"

# Epic's launcher writes one JSON manifest per installed application, and
# `crates/game-detection/src/launcher/epic` reads them (issue #44).
#
# This is the case the comment above set aside. The three reasons the *catalogue*
# is TOML — a file a contributor reads in a diff, comments explaining why an
# entry is shaped as it is, and a parse error with a line and column — are all
# about a file somebody authors. An Epic manifest is machine-written by
# somebody else's installer, in a format this project does not choose, so none of
# them applies and the format is not ours to pick.
#
# Already pinned in the workspace for the encoder cache and the IPC protocol, so
# this adds a dependency edge rather than a dependency. Dual MIT/Apache-2.0.
serde_json.workspace = true

# The same format, the other direction: `toml` reads a file into values and
# `toml_edit` changes a file that already exists without reformatting the rest
# of it.
#
# That is not a nicety here, it is the whole point of the third bullet above.
# The user's overlay is a file we tell people to hand-edit and to write comments
# in, and issue #45 puts a settings screen on top of the same file. Rendering
# the parsed document back — which is what `toml` alone can do — would mean that
# excluding one game from the UI silently deletes every comment and every
# arrangement of blocks the user chose in it (AGENTS.md section 56). A backup
# would make that recoverable rather than not destructive.
#
# It costs one crate and nothing else: `indexmap`, `winnow`, `toml_datetime`,
# `toml_parser` and `toml_writer` are already in the lockfile underneath `toml`,
# and `Cargo.lock` gained exactly this one line.
#
# Dual MIT/Apache-2.0.
toml_edit = "0.25.13"

# The catalogue's shapes are deserialised, and the workspace pins one serde for
# the reason its manifest gives.
serde = { workspace = true, features = ["derive"] }

# The logging facade. Diagnostics go through `tracing`; `clipped-logging` only
# decides where they end up (docs/logging.md). MIT.
tracing.workspace = true

# Two things, both of them paths. `RedactedPath` is how an executable path
# reaches a log line without taking the account name and games library layout
# with it (docs/logging.md), and a process watcher handles nothing but user
# paths. `application_directory` is the one function that says where the user's
# own catalogue overlay lives, beside the logs and the encoder's capability
# cache (issue #228). clipped-logging is layer 0 and this crate is layer 1, so
# this follows the dependency direction. MPL-2.0.
clipped-logging.workspace = true

# The process table and the executable behind a process identifier. This crate
# deliberately does not open a second route to that question: `clipped-windows`
# owns `OpenProcess` and the handle discipline around it (AGENTS.md section 55).
# MPL-2.0.
[target.'cfg(windows)'.dependencies]
clipped-windows.workspace = true

# WMI, its COM plumbing, and the process table. The feature list is the exact
# set of namespaces this crate names:
#
# - Win32_Foundation                     HANDLE, CloseHandle, ERROR_NO_MORE_FILES
# - Win32_System_Com                     CoCreateInstance, the proxy blanket, the
#                                        multi-threaded apartment WMI is pumped in
# - Win32_System_Diagnostics_ToolHelp    the process table, for the baseline and
#                                        for the polling fallback
# - Win32_System_Ole                     required by the VARIANT definition below
# - Win32_System_Registry                where Steam records its own install
#                                        directory, and the only place it does
#                                        (src/launcher/steam/registry.rs)
# - Win32_System_Rpc                     the authentication service constants
#                                        CoSetProxyBlanket takes
# - Win32_System_Variant                 VARIANT and VariantClear: how a WMI
#                                        property is read and released
# - Win32_System_Wmi                     the locator, the connection, the
#                                        notification query and its enumerator
#
# Target-specific so that the debounce, the vocabulary and their tests still
# compile and run on a machine that is not Windows (AGENTS.md section 5).
# Dual MIT/Apache-2.0.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Rpc",
    "Win32_System_Variant",
    "Win32_System_Wmi",
] }

# `examples/process_watch_probe.rs` reports the processor time this process used
# over an idle interval, which is `GetProcessTimes` and nothing else. Kept out of
# the shipped feature list because the library measures nothing about itself:
# the probe is how a number is taken, not something the recorder carries.
[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[lints]
workspace = true
