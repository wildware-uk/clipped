# Clipped's game catalogue — the seed data shipped with the application.
#
# ADDING A GAME NEEDS NO CODE. Append a `[[game]]` block to the end of this
# file and open a pull request; nothing in `crates/game-detection/src` has to
# change, and nothing has to be registered anywhere else. If your entry does
# not parse or does not validate, the build fails with a message naming this
# file and your entry — it is never skipped quietly.
#
# The full field reference, the matching rules and the precedence order are in
# docs/game-detection.md. The short version, and the whole schema:
#
#   [[game]]
#   game_id = "some-game"                # required, unique, [a-z0-9-]
#   name = "Some Game"                   # required, what a person calls it
#   icon = "some-game"                   # optional, an icon asset name
#   child_processes = ["helper.exe"]     # optional, processes the game spawns
#   highlight_providers = ["some-game"]  # optional, M9 highlight provider ids
#
#   [[game.executables]]                 # at least one required
#   name = "somegame.exe"                # a bare file name, never a path
#   path_contains = "steamapps/common/Some Game"  # optional qualifier
#
#   [game.launcher]                      # optional
#   kind = "steam"                       # steam, epic, xbox, battle-net, ea,
#                                        # ubisoft, riot, gog or other
#   app_id = "12345"                     # optional, the launcher's own id
#   not_the_game = ["helper.exe"]        # optional, processes in this game's
#                                        # install directory that are not it
#
#   [game.capture]                       # optional, defaults to "unknown"
#   compatibility = "unknown"            # unknown, graphics-capture,
#                                        # desktop-duplication or unsupported
#   note = "why, if it is not unknown"
#
#   [game.default_settings]              # optional, M7 decides what these mean
#   fps = 120
#
# THREE RULES WORTH KNOWING BEFORE YOU EDIT.
#
# 1. `path_contains` is how two games that ship the same executable name are
#    told apart, and `hl2.exe` below is the real case: Half-Life 2 and Team
#    Fortress 2 are different games running the same binary name. A qualified
#    entry beats an unqualified one, so adding a qualified entry never makes an
#    existing bare-name entry worse.
#
#    It names whole directories, not characters. `steamapps/common/Half-Life 2`
#    matches that directory and not `steamapps/common/Half-Life 2 Deathmatch`,
#    which is a different game running the same executable. Write the fragment
#    as the directories it is, with either kind of slash, and case does not
#    matter.
#
# 2. `compatibility` is a record of what somebody actually verified, not a
#    guess. Every entry here says `unknown`, because nobody has yet run a
#    capture against these games and written down what happened (AGENTS.md
#    section 18). Change one only alongside the evidence, in the pull request
#    that changes it.
#
# 3. An empty or absent field means "nobody has recorded this", not "there is
#    none". `child_processes = []` does not assert that a game spawns nothing.
#
# The schema version below is the format's, not the application's. It changes
# only when the shape of an entry changes, and docs/game-detection.md documents
# what an older or newer file does.
schema_version = 1

# --- Valve ------------------------------------------------------------------
#
# Every Source and Source 2 title is launched by Steam, and the Source 1 ones
# share one executable name between them, so they are the clearest illustration
# of why an executable name alone is not an identity.

[[game]]
game_id = "counter-strike-2"
name = "Counter-Strike 2"

[[game.executables]]
name = "cs2.exe"
# Counter-Strike 2 replaced Counter-Strike: Global Offensive in place, so it
# still installs into the directory named after the game it replaced.
path_contains = "steamapps/common/Counter-Strike Global Offensive"

[game.launcher]
kind = "steam"
app_id = "730"

[game.capture]
compatibility = "unknown"

[[game]]
game_id = "dota-2"
name = "Dota 2"

[[game.executables]]
name = "dota2.exe"
path_contains = "steamapps/common/dota 2 beta"

[game.launcher]
kind = "steam"
app_id = "570"

[game.capture]
compatibility = "unknown"

[[game]]
game_id = "team-fortress-2"
name = "Team Fortress 2"

[[game.executables]]
# Not a typo. Team Fortress 2 is a Source 1 game and its process is `hl2.exe`,
# exactly like Half-Life 2 below. The install directory is the only thing that
# separates them, which is why both entries are path-qualified: an unqualified
# `hl2.exe` entry here would claim every Source 1 game on the machine.
name = "hl2.exe"
path_contains = "steamapps/common/Team Fortress 2"

[game.launcher]
kind = "steam"
app_id = "440"

[game.capture]
compatibility = "unknown"

[[game]]
game_id = "half-life-2"
name = "Half-Life 2"

[[game.executables]]
# The qualifier is the directory name in full. Half-Life 2 Deathmatch, Lost
# Coast and both episodes are separate Steam applications that install beside
# this one, with directory names this one is a prefix of, and all of them run
# `hl2.exe` — so a fragment matched as characters rather than as directories
# would claim them as Half-Life 2.
name = "hl2.exe"
path_contains = "steamapps/common/Half-Life 2"

[game.launcher]
kind = "steam"
app_id = "220"

[game.capture]
compatibility = "unknown"

[[game]]
game_id = "portal-2"
name = "Portal 2"

[[game.executables]]
name = "portal2.exe"
path_contains = "steamapps/common/Portal 2"

[game.launcher]
kind = "steam"
app_id = "620"

[game.capture]
compatibility = "unknown"

# --- Riot Games -------------------------------------------------------------

[[game]]
game_id = "league-of-legends"
name = "League of Legends"

[[game.executables]]
# The game itself, not `LeagueClient.exe`: the client is a separate process
# that is running long before and after a match, and recording it would produce
# a session of somebody reading the shop.
name = "League of Legends.exe"

[game.launcher]
kind = "riot"
# The product identifier without the patchline: `live` and `pbe` are the same
# game and both answer this. Read from a real installation's metadata rather
# than guessed — Riot's own name for League is not "league".
app_id = "league_of_legends"
# Riot claims a *directory*, and these four live in League's. The client is the
# shop and the lobby: it runs for as long as somebody has it open, including
# while they are playing something else entirely, so without this line opening
# the shop would start a recording of League (issue #514). The game itself is
# `League of Legends.exe`, in `Game\` below them.
not_the_game = [
    "LeagueClient.exe",
    "LeagueClientUx.exe",
    "LeagueClientUxRender.exe",
    "LeagueCrashHandler64.exe",
]

[game.capture]
compatibility = "unknown"

[[game]]
game_id = "valorant"
name = "VALORANT"

[[game.executables]]
name = "VALORANT-Win64-Shipping.exe"

[game.launcher]
kind = "riot"
# The Riot product identifier without the patchline, the same shape as
# League's above. **Weaker evidence than the other identifiers in this file**:
# the machine this was read from has `valorant.live` in
# `%ProgramData%\Riot Games\Metadata` but no VALORANT installed, so this is
# Riot's own spelling of the product taken from its metadata directory rather
# than from a `product_install_full_path` that exists. Getting it wrong costs
# nothing beyond the rung: the name rung above still places the game.
app_id = "valorant"

[game.capture]
compatibility = "unknown"

# --- Epic Games -------------------------------------------------------------

[[game]]
game_id = "fortnite"
name = "Fortnite"

[[game.executables]]
name = "FortniteClient-Win64-Shipping.exe"

[game.launcher]
kind = "epic"
# Epic's `AppName`, read from `Fortnite.item` in its manifest directory on a
# machine with Fortnite installed. It is the display name here and an opaque
# hexadecimal string for other titles, so it is copied rather than guessed at.
#
# On that machine the launcher rung fires for `FortniteBootstrapper.exe` and
# *not* for the executable named above, because two manifests share
# `B:\Epic Games\Fortnite` — `Fortnite` and the `Fortnite_StWContent` content
# pack — and Epic refuses a tie it cannot break on `LaunchExecutable` rather
# than guessing (see docs/game-detection.md, "Epic"). The name rung still
# places the client, which is why this entry is no worse for it.
app_id = "Fortnite"

[game.capture]
compatibility = "unknown"

[[game]]
game_id = "rocket-league"
name = "Rocket League"

[[game.executables]]
name = "RocketLeague.exe"

[game.launcher]
kind = "epic"
# No `app_id`. Epic's `AppName` for a game is opaque for most titles — the two
# Grand Theft Auto manifests on the machine the entry above was read from are
# `8769e24080ea413b8ebca3f1b8c50951` and `9d2d0eb64d5c44529cece33fe2a46482` —
# so it cannot be guessed at, and nobody has had Rocket League installed to
# copy it from. The name rung places the game meanwhile.

[game.capture]
compatibility = "unknown"

# --- Ubisoft ----------------------------------------------------------------
#
# Ubisoft's identifier is a small integer and the name is nowhere near it: the
# number is the subkey under `Ubisoft\Launcher\Installs`, and the name has to
# be fetched from the matching `Uplay Install <id>` uninstall entry. Both were
# read off a machine with the game installed.

[[game]]
game_id = "trackmania"
name = "Trackmania"

[[game.executables]]
name = "Trackmania.exe"

[game.launcher]
kind = "ubisoft"
# `HKLM\SOFTWARE\WOW6432Node\Ubisoft\Launcher\Installs\5595`, whose `InstallDir`
# is the directory this game runs from. Nothing about the number says which
# game it is, which is why it is copied from a real installation rather than
# looked up.
app_id = "5595"

[game.capture]
compatibility = "unknown"

# --- Blizzard ---------------------------------------------------------------

[[game]]
game_id = "overwatch-2"
name = "Overwatch 2"

[[game.executables]]
# Overwatch 2 replaced Overwatch in place and kept the executable name.
name = "Overwatch.exe"

[game.launcher]
kind = "battle-net"
# Blizzard's product code, not the game's name: read from the `--uid=` flag of
# the uninstall entry Battle.net wrote on a machine with Overwatch installed.
# `Battle.net.config` uses the same code, and the game's own `.build.info`
# calls it `pro` — a third spelling this deliberately does not use.
app_id = "prometheus"

[game.capture]
compatibility = "unknown"

# --- Microsoft Store --------------------------------------------------------
#
# An Xbox identifier is a package *family* name — the publisher-facing name, an
# underscore, and the publisher hash — and this is the one section of this file
# where an executable name is close to useless on its own. Every packaged game
# below declares `gamelaunchhelper.exe` as the program the Store starts, so
# several different games present a process of the same name and only the
# launcher rung can tell them apart (docs/game-detection.md, "Microsoft Store
# packaged apps, and what they cost").
#
# Every family name here was read from
# `HKLM\SOFTWARE\Microsoft\GamingServices\PackageRepository\Root` on a machine
# with the game installed, and cross-checked against the package's own
# `AppxManifest.xml` for the name a person would call it.

[[game]]
game_id = "minecraft-bedrock"
name = "Minecraft: Bedrock Edition"

[[game.executables]]
name = "Minecraft.Windows.exe"

[game.launcher]
kind = "xbox"
# No `app_id`, deliberately. The family name is widely repeated as
# `Microsoft.MinecraftUWP_8wekyb3d8bbwe`, and nobody working on this has had
# the game installed to read it out of the package repository — so writing it
# here would record somebody else's recollection as evidence, which is exactly
# what the entries above avoid. The name rung places the game meanwhile, which
# is what it has always done.

[game.capture]
compatibility = "unknown"

[[game]]
game_id = "call-of-duty"
name = "Call of Duty"

[[game.executables]]
name = "cod.exe"

[game.launcher]
kind = "xbox"
# One package hosts several Call of Duty titles — its directory holds `cod24`
# and `cod25` side by side — so this entry is the package, which is as fine a
# distinction as the identifier can make.
#
# Note the shape: a *single* underscore before the publisher hash, because the
# full name carries a resource qualifier (`..._x64_ww_5bkah9njm3e9g`). This is
# the package that a `__` split drops silently.
app_id = "38985CA0.COREBase_5bkah9njm3e9g"

[game.capture]
compatibility = "unknown"

[[game]]
game_id = "microsoft-flight-simulator-2024"
name = "Microsoft Flight Simulator 2024"

[[game.executables]]
name = "FlightSimulator2024.exe"

[game.launcher]
kind = "xbox"
# `Limitless` is the package's name and not a description of it; the manifest
# inside is what says which game this is.
app_id = "Microsoft.Limitless_8wekyb3d8bbwe"

[game.capture]
compatibility = "unknown"

[[game]]
game_id = "oblivion-remastered"
name = "The Elder Scrolls IV: Oblivion Remastered"

[[game.executables]]
name = "OblivionRemastered-WinGDK-Shipping.exe"

[game.launcher]
kind = "xbox"
# `ProjectAltar` is the development name the package kept.
app_id = "BethesdaSoftworks.ProjectAltar_3275kfvn8vcwc"

[game.capture]
compatibility = "unknown"

# --- Widely played Steam titles ---------------------------------------------
#
# Every executable name below was read off a real installation rather than
# looked up, and every entry carries its Steam application identifier, which is
# the rung that identifies a game whose process is called something generic
# (`catalogue::matching`). The identifier is what makes these robust: it is
# matched before the executable is consulted at all, so a game that renames its
# binary in a patch keeps being recognised.
#
# `not_the_game` is used where the install directory contains a launcher or an
# anti-cheat bootstrapper that runs first and is not the thing to record.
# `start_protected_game.exe` is Easy Anti-Cheat's and appears in three of these
# directories, which is precisely why it is named per game rather than globally.

