[package]
name = "clipped-library"
description = "Recording library indexing, search and metadata"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# A virtual clip is a range of a recording that behaves like a clip with no file
# behind it, so it is described in the edit document model's vocabulary rather
# than a parallel one (#82, AGENTS.md section 55), and it says which event it
# came from (#68). Both are layer 0. serde persists it.
clipped-edit.workspace = true
clipped-events.workspace = true
# The logging facade. Storage accounting walks the user's library, and the two
# things it can discover — a root it could not read, and a scan that ran out of
# its budget — are exactly the diagnostics somebody investigating "why does the
# reported figure look wrong" needs. MIT.
tracing.workspace = true

# For `RedactedPath`. Every path accounting could log is a path inside the
# user's own profile — a storage root is `C:\Users\<account>\Videos\Clipped\...`
# — so the account name and the folders somebody chose are reduced before they
# reach a log file (docs/logging.md, "Privacy"; AGENTS.md section 13).
# `clipped-logging` is layer 0 and this crate is layer 1, so this follows the
# dependency direction.
clipped-logging.workspace = true

# How much of a volume is free, and how large it is: `GetDiskFreeSpaceExW`.
# Target-specific so that the platform-neutral half of this crate still compiles
# and its unit tests still run on a contributor's other machine; the call itself
# lives behind `#[cfg(windows)]` in `src/accounting/windows/` (AGENTS.md
# section 5). The feature list is the exact set of namespaces that file names.
# Dual MIT/Apache-2.0.
# The calendar a `date:` term is compared against (`src/search/date.rs`).
# `time::Date` is exactly what this needs — a date with no time and no zone,
# ordered chronologically, validated against the Gregorian calendar — and
# hand-rolling a second one here would put a second leap-year rule in the
# product (AGENTS.md section 55). It also removes an adapter from issue #56:
# the indexer holds an `OffsetDateTime`, and `OffsetDateTime::date()` is
# already the day a row belongs to. `std` is the only feature named; nothing
# here formats, parses or asks the operating system the time. Taken from the
# workspace, which says why the version is pinned there.
time = { workspace = true, features = ["std", "formatting", "parsing", "local-offset"] }

# The database this crate indexes into. `clipped-storage` owns the file, the
# schema and the write path; this crate owns what the rows *mean*, which is the
# split docs/storage.md draws and the reason ingestion lives here rather than
# there. It re-exports `rusqlite`, so the SQL below names one version of the
# binding — the storage crate's.
clipped-storage.workspace = true

# The session sidecars this crate ingests are JSON that `clipped-session` wrote
# (docs/sessions.md). Reading them is what indexing is, so the deserialiser is a
# dependency of the crate rather than of its tests. Both dual MIT/Apache-2.0 and
# already pinned in the workspace.
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
# `tests/accounting_privacy.rs` renders real log output through a real
# subscriber and asserts on the bytes that would have reached a log file, which
# is the only way to prove a path was reduced before it was recorded. The same
# approach as `crates/logging/tests/privacy.rs`. MIT.
tracing-subscriber = "0.3"

# `examples/scan_cost.rs` builds a synthetic library of a requested size and
# times a scan of it, which is where the figures in docs/storage-management.md
# come from. It takes arguments, and every executable in this workspace presents
# the same argument syntax and the same usage errors (the root manifest says
# why).
clap.workspace = true


# Reading the session sidecars the recorder writes (docs/sessions.md). The file
# is JSON, so this is `serde` deriving one struct per shape in that document,
# and `serde_json` for the parse and for the event detail this crate stores
# without interpreting. Both dual MIT/Apache-2.0, both already in the graph.
serde.workspace = true
serde_json.workspace = true

# Timestamps. Every time column in the schema is RFC 3339 text with an offset,
# exactly as a sidecar writes it, so ingesting one is a copy — but reconciling
# has to *compare* moments (which session is the most recent for this game) and
# has to *write* one (when a recording was first found to be gone), and neither
# is safe on text: two RFC 3339 strings in different offsets do not compare
# lexicographically. `time` is already the workspace's calendar crate —
# `clipped-session` stamps sessions with it — so this is the same dependency
# rather than a second one (AGENTS.md sections 10 and 55). Dual MIT/Apache-2.0.
#
# `parsing` is the feature `clipped-session` does not need and this crate does:
# the recorder only ever writes these strings, and the index is the first thing
# that has to read one back.
# Diagnostics, through the facade every crate calls directly (docs/logging.md).
# Indexing runs unattended on a background thread, so what it decided about a
# file nobody can find afterwards is only knowable from the log. MIT.
tracing.workspace = true

[lints]
workspace = true
