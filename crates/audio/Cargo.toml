[package]
name = "clipped-audio"
description = "Audio capture, per-source routing and track assembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The logging facade. Diagnostics go through `tracing`; `clipped-logging` only
# decides where they end up (docs/logging.md). MIT.
tracing.workspace = true

# The vocabulary of the `audio_source` log field, which docs/logging.md defines
# as a closed enumeration precisely so that a capture's diagnostics can be
# searched by source months later. Depending on the type rather than writing the
# words here is what keeps the code and that table in step. `clipped-logging` is
# layer 0 and `clipped-audio` is layer 1, so this is the direction
# `tests/integration/tests/workspace_layering.rs` enforces. It is also what
# `examples/loopback_probe.rs` and `examples/microphone_probe.rs` install to get
# Clipped's own logging, so that endpoint-change lines appear exactly as they
# will in a recording session. MPL-2.0.
clipped-logging.workspace = true

# WASAPI, the device enumerator whose notifications tell this crate that the
# default endpoint moved, and the performance counter every timestamp is
# expressed against. Target-specific so that the platform-neutral half of this
# crate — the format vocabulary, the timeline that fills silence, the sample
# conversion — still compiles and still runs its unit tests on a machine that is
# not Windows; the capture client itself lives behind `#[cfg(windows)]` in
# `src/windows/` (AGENTS.md section 5).
#
# The feature list is the exact set of namespaces this crate names. Dual
# MIT/Apache-2.0.
[target.'cfg(windows)'.dependencies]
# Which processes a game consists of, right now (`ProcessTree`, issue #25).
# Process-scoped loopback capture scopes a client to one process and the
# processes it started, and the set of processes that means has to be tracked
# from this side too: to know when the game has gone, and to re-scope the
# capture when the process the activation names exits while the game lives on
# (`src/windows/process_loopback.rs`). It is layer 0 of the dependency table in
# README.md and this crate is layer 1, which is the direction
# `tests/integration/tests/workspace_layering.rs` enforces. Target-specific
# because the tree is a Windows facility and the platform-neutral half of this
# crate compiles anywhere. MPL-2.0.
clipped-windows.workspace = true

windows = { workspace = true, features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

# The COM plumbing behind `windows`, named directly for one reason: this crate
# *implements* a COM interface rather than only calling them.
# `IMMNotificationClient` is how Windows tells a recording that its audio device
# has been unplugged (`src/windows/notifications.rs`), and the `#[implement]`
# macro that builds its vtable generates code rooted at `::windows_core`, which
# only resolves if this crate depends on it by name. It is not a second copy of
# anything: `windows 0.62` is built on this crate, and both resolve to one
# `0.62.x`. The version lives in `[workspace.dependencies]` beside the `windows`
# pin, because keeping the two in step is the whole point and a literal here
# would not move when that one does.
windows-core.workspace = true

# `src/windows/endpoint_capture.rs` has one decision whose only outcome is a log
# line — whether a failed WASAPI call is an unplugged device or an unexplained
# fault — so the test for it reads what was rendered rather than trusting the
# branch. Test-only, and the same version `clipped-logging` builds its own
# subscriber from. MIT.
[dev-dependencies]
tracing-subscriber = "0.3"

# The Goertzel filter `tests/compatibility_mix.rs` measures the mix with. A
# compatibility mix that summed nothing and emitted silence of exactly the right
# length would satisfy every structural assertion in this crate, so the claim
# that every source is *audible* in it — and that no source is audible on
# anybody else's track — is made by measuring energy at a frequency rather than
# by asserting it (AGENTS.md sections 21 and 26). The same filter, through the
# same type, that `crates/muxer/tests/multi_track_audio.rs` asserts a finished
# recording with; sharing it is what keeps one measurement rather than two.
#
# Test-only and layer 0, which is what
# `tests/integration/tests/workspace_layering.rs` holds it to: it must never
# appear under `[dependencies]`. Nothing here needs `ffprobe` — the samples are
# in hand, so `AudioContent::from_samples` is the whole of it. MPL-2.0.
clipped-media-validation.workspace = true

# `tests/system_audio.rs` plays a tone it synthesises itself, so that the
# frequency assertion has a known signal to find and the test needs no installed
# application (AGENTS.md sections 25 and 26). Rendering needs the same WASAPI
# namespaces the library uses, plus nothing else; none of this reaches the
# library.
[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Threading",
] }

[lints]
workspace = true
