[package]
name = "clipped-logging"
description = "Diagnostic subscriber setup, log configuration and typed logging context"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Per-frame tracing is off by default so that capture threads pay nothing for
# it. See the "Logging from a capture thread" section of docs/logging.md.
frame-tracing = []

[dependencies]
# The logging facade every other crate calls directly. MIT.
tracing = "0.1"
# Subscriber implementation, plus `EnvFilter` for runtime level configuration. MIT.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Rolling file appender and the background writer that keeps disk I/O off the
# calling thread. MIT.
tracing-appender = "0.2"

# The integration tests link against this crate's public API only, so they need
# their own declarations of the two crates they exercise it through. Both are
# already built for the library; no extra dependency enters the build.
[dev-dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
