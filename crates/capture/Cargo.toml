[package]
name = "clipped-capture"
description = "Video frame capture backends and target selection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The logging facade. Diagnostics go through `tracing`; `clipped-logging` only
# decides where they end up (docs/logging.md). MIT.
tracing.workspace = true

# Windows Graphics Capture and the Direct3D 11 device it interoperates with.
# Target-specific so that the platform-neutral half of this crate still compiles
# and unit tests still run on a machine that is not Windows; the backend itself
# lives behind `#[cfg(windows)]` in `src/windows/` (AGENTS.md section 5).
#
# The feature list is the exact set of namespaces the backend names, because
# every extra one is generated code somebody has to compile. Dual MIT/Apache-2.0.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Foundation",
    "Foundation_Metadata",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
] }

# `CaptureMethod::log_value` must produce the same words as the `capture_backend`
# field vocabulary in `clipped-logging`, and the only way to assert that is to
# compare against the real enumeration. A dev-dependency does that without
# putting a logging dependency into anything that links this crate, and
# clipped-logging is a layer below clipped-capture, so it does not bend the
# dependency direction either (tests/integration/tests/workspace_layering.rs).
[dev-dependencies]
clipped-logging.workspace = true

# `examples/wgc_probe.rs` renders its own Direct3D 11 test window and samples
# this process's memory, handles and video memory, so that the acceptance
# criteria on issue #12 are measured against something controlled rather than
# against an installed game (AGENTS.md sections 25 and 26). None of these
# namespaces reach the library.
[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
