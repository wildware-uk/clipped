[package]
name = "clipped-muxer"
description = "Container writing and remuxing built on the FFmpeg libraries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The raw FFmpeg FFI, and nothing above it. This crate is the only place in the
# workspace that names it: the safe wrappers over FFmpeg are written here, and
# everything else in Clipped goes through them
# (docs/adr/0004-ffmpeg-dependency-strategy.md).
rusty_ffmpeg.workspace = true
tracing.workspace = true
# For `RedactedPath`. A recording's path contains the account name and the
# folders somebody chose, so the writer logs the reduced form rather than the
# path (docs/logging.md, "Privacy"). clipped-logging is layer 0 and this crate
# is layer 2, so this follows the dependency direction.
clipped-logging.workspace = true

[build-dependencies]
# Places the pinned FFmpeg DLLs beside the binaries this build produces, so
# that nothing has to be on PATH. Shared with clipped-encoder, which links
# FFmpeg too and is not a dependent of this crate (issue #158).
clipped-ffmpeg-runtime.workspace = true

[dev-dependencies]
# The synthetic-recording example takes command-line arguments, and every
# executable in this workspace presents the same argument syntax and the same
# usage errors (the root manifest says why).
clap.workspace = true
# What the recordings this crate writes are checked with: the container opens,
# the streams are the ones that were declared, the duration is plausible, the
# timestamps increase and the tracks are in sync (AGENTS.md section 22). It is
# the workspace's one media validator rather than this crate's — every crate
# that produces media uses it, and it is tested against files that are broken as
# well as files that are not (tests/media, docs/testing.md).
clipped-media-validation.workspace = true
# The synthetic-recording example encodes its test pattern with the real
# software encoder rather than talking to `libopenh264` itself, so that the
# stream the muxer's own tests write is what a recording session actually
# produces (issue #159). `clipped-encoder` is layer 1 and this crate is layer
# 2, so a dev-dependency on it still points down
# (tests/integration/tests/workspace_layering.rs counts dev-dependencies too).
clipped-encoder.workspace = true
# `SoftwareEncoder` reads frames out of a Direct3D 11 texture rather than
# system memory, so the example needs a device to hold one on and a way to
# upload pixels into it — the same two things
# `crates/encoder/src/software/tests.rs` needs for the same reason. Hardware
# where there is any, the WARP software rasteriser otherwise, which is why
# nothing here is gated behind a GPU being present the way an actual hardware
# *encoder* would be (AGENTS.md section 58): WARP ships with Windows, so
# `crates/muxer/tests/synthetic_recording.rs` and
# `crates/muxer/tests/abrupt_termination.rs` can keep running by default.
# Dual MIT/Apache-2.0.
windows = { workspace = true, features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
] }

[lints]
workspace = true
