[package]
name = "clipped-muxer"
description = "Container writing and remuxing built on the FFmpeg libraries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The raw FFmpeg FFI, and nothing above it. This crate is the only place in the
# workspace that names it: the safe wrappers over FFmpeg are written here, and
# everything else in Clipped goes through them
# (docs/adr/0004-ffmpeg-dependency-strategy.md).
rusty_ffmpeg.workspace = true
tracing.workspace = true
# For `RedactedPath`. A recording's path contains the account name and the
# folders somebody chose, so the writer logs the reduced form rather than the
# path (docs/logging.md, "Privacy"). clipped-logging is layer 0 and this crate
# is layer 2, so this follows the dependency direction.
clipped-logging.workspace = true

# The muxer's own tests write real recordings and then take them apart again:
# the synthetic-recording example encodes video with the pinned build's
# software encoder, and `crates/muxer/tests/support` reads finished files back
# with the demuxer to check what was written. Both need the FFI directly, and an
# integration test can only reach a dependency the manifest lists for it.
[dev-dependencies]
rusty_ffmpeg.workspace = true
# The synthetic-recording example takes command-line arguments, and every
# executable in this workspace presents the same argument syntax and the same
# usage errors (the root manifest says why).
clap.workspace = true
# `ffprobe` reports in JSON, and the media tests assert on what it says
# (AGENTS.md section 22). Parsing it by hand would make a test fail for reasons
# that have nothing to do with the recording.
serde_json.workspace = true

[lints]
workspace = true
