# Continuous integration for Clipped.
#
# Clipped is a Windows application, so everything here runs on Windows. A green
# build on Linux would tell us nothing about whether the recorder compiles
# against the Windows SDK, and AGENTS.md section 51 is explicit that code which
# only works on the original developer's machine does not get merged.
#
# The four commands in the `rust` job are the same four CONTRIBUTING.md asks a
# contributor to run before opening a pull request. They are deliberately not
# paraphrased here: if CI and the contribution guide disagree about what "done"
# means, the contribution guide loses, and nobody finds out until review.
#
# Every `uses:` below is pinned to a full commit SHA, with the human-readable
# version in a trailing comment. A tag is not a pin: whoever controls the action
# repository can move `v4` to point at a different commit, which is exactly how
# the tj-actions/changed-files compromise reached consumers who thought they had
# pinned. A SHA names one immutable tree. Dependabot understands SHA pins and
# rewrites the trailing comment when it bumps one, so this costs nothing in
# staleness - see .github/dependabot.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing here writes to the repository. Checks report through the check-run
# API, which needs no token permissions beyond reading the code.
permissions:
  contents: read

# A pull request that is pushed to twice in quick succession does not need the
# first run finished. Pushes to `main` are never cancelled: `main` being green
# is a fact about a commit, and cancelling that run would leave a gap in it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # A test that fails only in CI is the most expensive kind to diagnose, so the
  # backtrace is captured the first time rather than after a re-run.
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: pwsh

jobs:
  rust:
    name: Rust (format, lint, build, test)
    # `windows-latest` rather than a pinned image: the reproducibility that
    # matters here is the compiler, and rust-toolchain.toml pins that exactly.
    # Following the current image means a Windows SDK or MSVC change reaches us
    # as a CI failure we can look at, rather than as a bug report from the first
    # contributor to upgrade.
    runs-on: windows-latest

    steps:
      # .gitattributes normalises the repository to LF and rustfmt.toml sets
      # newline_style = "Unix". GitHub's Windows images ship git with
      # core.autocrlf enabled, so without this the checkout is free to write
      # CRLF and `cargo fmt --all --check` fails on every file for reasons that
      # have nothing to do with the change under test. This has to run before
      # the checkout, because the checkout is what would do the converting.
      - name: Keep git from rewriting line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The step above states an intention; this one checks it held. A working
      # tree with CRLF in it produces confusing formatting failures later, and
      # "CI rewrote your line endings" is a much more useful thing to read than
      # a thousand-line rustfmt diff.
      - name: Verify the working tree uses LF line endings
        run: |
          $offenders = @(git ls-files --eol | Where-Object { $_ -match 'w/(crlf|mixed)' })
          if ($offenders.Count -gt 0) {
              Write-Host 'Files were checked out with non-LF line endings:' -ForegroundColor Red
              $offenders | ForEach-Object { Write-Host "  $_" }
              Write-Host ''
              Write-Host 'The repository is LF-only (.gitattributes) and rustfmt.toml sets newline_style = "Unix".'
              exit 1
          }
          Write-Host "All $((git ls-files).Count) tracked files are LF or binary."

      # rust-toolchain.toml is the single source of truth for the compiler
      # version, the components and the target. Installing a toolchain by name
      # here - with dtolnay/rust-toolchain or otherwise - would mean CI could
      # silently drift from what contributors build with, which is the exact
      # thing the pin exists to prevent. `rustup toolchain install` with no
      # arguments reads the file, and is the command docs/prerequisites.md tells
      # a new contributor to run.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      # crates/muxer links against the FFmpeg C libraries (issue #7), and
      # `rusty_ffmpeg` generates their FFI with bindgen, which loads libclang.dll
      # at build time. Without LIBCLANG_PATH pointing at a directory containing
      # that DLL, the build fails with "Unable to find libclang" - a message
      # that names neither FFmpeg nor the step that should have set it up.
      #
      # The runner image is widely said to ship LLVM at C:\Program Files\LLVM.
      # This step does not assume that: it reports every location it looked in
      # and what it found, so the log answers the question rather than the
      # comment doing it. It fails the job when nothing is found, because the
      # workspace now genuinely cannot build without it, and a red step naming
      # LLVM is a better thing to read than a build error from a dependency's
      # build script several minutes later.
      - name: Locate libclang for bindgen
        run: |
          $candidates = @(
              'C:\Program Files\LLVM\bin'
              'C:\Program Files (x86)\LLVM\bin'
          )
          # LLVM also ships inside Visual Studio as an optional component. Ask
          # vswhere where VS actually is rather than guessing at a year and an
          # edition in a path, both of which change with the image.
          $programFilesX86 = ${env:ProgramFiles(x86)}
          $vswhere = if ($programFilesX86) {
              Join-Path $programFilesX86 'Microsoft Visual Studio\Installer\vswhere.exe'
          } else { $null }
          if ($vswhere -and (Test-Path -LiteralPath $vswhere)) {
              $vsRoot = & $vswhere -latest -products * -property installationPath
              if ($vsRoot) { $candidates += (Join-Path $vsRoot 'VC\Tools\Llvm\x64\bin') }
          }

          Write-Host 'Looking for libclang.dll:'
          $found = $null
          foreach ($dir in $candidates) {
              $dll = Join-Path $dir 'libclang.dll'
              if (Test-Path -LiteralPath $dll) {
                  $size = [math]::Round((Get-Item -LiteralPath $dll).Length / 1MB, 1)
                  Write-Host "  [found]   $dll (${size} MB)"
                  if (-not $found) { $found = $dir }
              }
              else {
                  Write-Host "  [missing] $dll"
              }
          }

          $clang = Get-Command clang -ErrorAction SilentlyContinue
          if ($clang) {
              Write-Host "clang on PATH: $($clang.Source)"
              Write-Host "  $(& clang --version | Select-Object -First 1)"
          }
          else {
              Write-Host 'clang is not on PATH.'
          }

          if (-not $found) {
              $message = "libclang.dll was not found in any known location on this runner. crates/muxer cannot build without it. Install LLVM in this step - the image is expected to ship it, so its absence is a change in the image rather than in this repository."
              Write-Host ''
              Write-Host $message -ForegroundColor Red
              "> $message`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              exit 1
          }

          "LIBCLANG_PATH=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host ''
          Write-Host "LIBCLANG_PATH=$found for the rest of this job."
          "> libclang: found at ``$found``, LIBCLANG_PATH set.`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # The FFmpeg build is pinned to one immutable release asset, so the cache
      # key is the asset name and a hit is always the right bytes. Moving the pin
      # changes the key, so a run on the new pin starts from an empty cache
      # rather than from the previous build; the fetch script would replace it
      # anyway, because it checks the pin record it wrote rather than the
      # directory name.
      #
      # The key comes out of the script rather than being repeated here. A second
      # copy of the asset name in this file would be a second thing to update
      # when the pin moves, and getting it wrong would silently restore the wrong
      # build - which the linkage tests would catch, but only after several
      # minutes and with a confusing message.
      #
      # Asked of the script rather than read out of it. An earlier version of
      # this step recovered the asset name with a regular expression over the
      # script's parameter block, which made this the second reader of the pin
      # and the more brittle one: reformatting that block leaves
      # scripts/fetch-ffmpeg-source.ps1 - which parses it - working, and fails
      # the build here. -PrintPin is the pin reporting itself, so there is
      # nothing left in this file that can disagree with it.
      - name: Read the pinned FFmpeg asset name
        id: ffmpeg-pin
        run: |
          $printed = & powershell -ExecutionPolicy Bypass -File scripts/fetch-ffmpeg.ps1 -PrintPin
          if ($LASTEXITCODE -ne 0) {
              Write-Host 'scripts/fetch-ffmpeg.ps1 -PrintPin failed.' -ForegroundColor Red
              exit 1
          }
          $asset = ($printed | Select-String -Pattern '^asset=(.+)$' | Select-Object -First 1)
          if (-not $asset) {
              Write-Host 'scripts/fetch-ffmpeg.ps1 -PrintPin printed no asset name.' -ForegroundColor Red
              Write-Host ($printed -join "`n")
              exit 1
          }
          $asset = $asset.Matches[0].Groups[1].Value
          Write-Host "Pinned FFmpeg asset: $asset"
          "asset=$asset" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Cache the pinned FFmpeg build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third-party/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ steps.ffmpeg-pin.outputs.asset }}

      # Unconditional, and cheap on a cache hit: the script verifies the recorded
      # pin, touches no network and exits. It exports nothing, and nothing here
      # has to. FFMPEG_DIR, FFMPEG_INCLUDE_DIR, FFMPEG_LIBS_DIR and
      # FFMPEG_LINK_MODE come from the checked-out .cargo/config.toml, so the
      # runner is configured by the same file and the same commit a contributor
      # builds with - which is the only way this job can be evidence that the
      # documented steps work.
      - name: Fetch FFmpeg
        run: |
          & powershell -ExecutionPolicy Bypass -File scripts/fetch-ffmpeg.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Issue #3 asks for the documented prerequisites to be verified on a
      # machine that has never built the project. A GitHub-hosted runner is
      # exactly that, every single run. Its output is copied into the run
      # summary so that a drift in the documentation is visible without opening
      # the log.
      #
      # It runs after the two steps above rather than before them, because it
      # now checks for libclang and for the fetched FFmpeg. Those are set up by
      # this workflow, not by the image, so checking first would only ever
      # report the state of a job that had not started yet.
      #
      # Invoked the way docs/prerequisites.md says to invoke it, including the
      # Windows PowerShell 5.1 host, so that what CI exercises is what a
      # contributor pastes.
      - name: Check documented prerequisites
        shell: powershell
        run: |
          # GitHub prepends `$ErrorActionPreference = 'stop'` to a `powershell`
          # step. Under Windows PowerShell 5.1, merging a native executable's
          # stderr into the success stream with `2>&1` wraps each stderr line in
          # a NativeCommandError ErrorRecord, which is terminating under Stop.
          # So the first time the script below wrote anything to stderr, this
          # step would throw before `$output` was ever assigned: no log, no run
          # summary, no `exit $code`. That is precisely the unhappy path this
          # step exists to report on, so stderr is captured with the preference
          # relaxed and the exit code is decided by the script, not by the host.
          $ErrorActionPreference = 'Continue'
          $output = & powershell -ExecutionPolicy Bypass -File scripts/check-prerequisites.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          "## Prerequisite check on a clean runner`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "``````text`n$output`n``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit $code

      # Restores the cargo registry, the git checkouts and target/, keyed on the
      # lockfile and the toolchain, and prunes artefacts that no longer belong
      # to any dependency so the cache does not grow without bound.
      #
      # Licence note: rust-cache is LGPL-3.0. That is a licence Clipped will not
      # accept in a *dependency* (CONTRIBUTING.md), but this is not one - it is
      # never linked into the recorder and is never distributed by us, it only
      # runs on GitHub's infrastructure, and the LGPL places no conditions on
      # running a program. Pinned to a commit SHA, like everything else here, so
      # that neither a new release nor a moved tag can change a build without a
      # commit in this repository saying so.
      - name: Restore the cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all --check

      # --all-targets so that tests, benches and examples are linted too; a
      # warning in a test file is still a warning somebody has to read.
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      # Hardware-dependent capture and encoder tests are deliberately not run
      # here: a hosted runner has no GPU and no game to record, so they would be
      # testing the runner rather than Clipped. That path is manual and is
      # tracked in M13.
      #
      # CLIPPED_REQUIRE_CAPTURE turns "this machine could not run the test" from
      # a pass into a failure for the capture tests that need a real window and
      # a real compositor. Without it those tests skip silently, and a
      # regression that turns the closure and minimise regression tests into
      # no-ops looks exactly like a run in which they passed: "green" and "ran"
      # stop being the same statement. If a future runner image loses the
      # compositor, this fails loudly and names the reason, which is the point.
      #
      # CLIPPED_REQUIRE_MEDIA does the same for the media validation harness
      # (tests/media, docs/testing.md). Its tests link nothing: they run
      # ffprobe.exe and ffmpeg.exe from the pinned build, so a fetch-script or
      # cache regression that left the libraries but not the programs would
      # still build and would silently skip every test that proves the harness
      # detects a truncated file, a missing track or a rewound cluster. The
      # build failing first is not a guarantee that covers them.
      - name: Test
        env:
          CLIPPED_REQUIRE_CAPTURE: '1'
          CLIPPED_REQUIRE_MEDIA: '1'
        run: cargo test --workspace

      # What a release is legally obliged to ship (docs/licensing.md): the
      # notices payload and the corresponding source of the pinned FFmpeg. Both
      # generators are PowerShell, so `cargo test` cannot reach them, and
      # neither can be checked by reading - the notices are 2 MB of reproduced
      # licence text and the source pin is one asset name.
      #
      # Here rather than left to a contributor's hand, unlike
      # test-check-prerequisites.ps1: that one guards a developer's setup and
      # fails visibly for whoever broke it, whereas these guard what a user is
      # given, and a regression in them is silent by construction - a payload
      # missing two hundred notices reads exactly like a complete one.
      #
      # This job is where they belong. test-collect-notices.ps1 needs the pinned
      # FFmpeg, which the fetch step above installed, and `cargo metadata` for
      # both workspaces; test-fetch-ffmpeg-source.ps1 needs neither a network
      # nor git, because every case runs the script with -PlanOnly.
      #
      # Invoked through the Windows PowerShell 5.1 host each script declares,
      # for the same reason the prerequisite check is: what CI exercises should
      # be what a contributor pastes.
      - name: Check the release licence tooling
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $failed = @()
          foreach ($suite in @('scripts/test-collect-notices.ps1', 'scripts/test-fetch-ffmpeg-source.ps1')) {
              Write-Host "== $suite"
              $output = & powershell -ExecutionPolicy Bypass -File $suite 2>&1 | Out-String
              $code = $LASTEXITCODE
              Write-Host $output
              "## $suite`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              "``````text`n$output`n``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              if ($code -ne 0) { $failed += "$suite exited $code" }
          }
          if ($failed.Count -gt 0) {
              Write-Host ($failed -join "`n") -ForegroundColor Red
              exit 1
          }

  deny:
    name: Dependencies (licences and advisories)
    runs-on: windows-latest

    steps:
      - name: Keep git from rewriting line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      # Pinned to an exact cargo-deny version: the advisory database moves on
      # its own, which is the point, but the tool interpreting deny.toml should
      # not change underneath a pull request as well.
      - name: Install cargo-deny
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-deny@0.20.2

      # Runs every check deny.toml configures: licences against the allow-list,
      # RustSec advisories, banned and wildcard version requirements, and the
      # registries dependencies come from. --all-features because an optional
      # dependency's licence is not optional.
      #
      # --allow advisory-not-detected because the [advisories] ignore list is
      # written for the desktop crate's graph, not this one; deny.toml says why,
      # and the step below is left strict so a stale entry is still reported.
      - name: Check dependency licences and advisories
        run: cargo deny --all-features check --allow advisory-not-detected

      # apps/desktop/src-tauri is a second Cargo workspace with a second
      # lockfile - 429 packages against the root's 113, almost none of them
      # shared - so the step above does not see a single one of them. Detaching
      # that crate must not be a way for several hundred dependencies to stop
      # being asked the two questions deny.toml asks of everything else.
      #
      # It runs here rather than in the Desktop UI job because cargo-deny reads
      # `cargo metadata`, which runs no build scripts: the check needs neither
      # Node nor apps/desktop/dist, and this job already has the toolchain and
      # the pinned cargo-deny. --config points it back at the one policy, which
      # it would not find beside a manifest in a different directory.
      - name: Check the desktop crate's dependency licences and advisories
        run: cargo deny --all-features --manifest-path apps/desktop/src-tauri/Cargo.toml --config deny.toml check

  ui:
    name: Desktop UI (lint, test and build)
    runs-on: windows-latest

    steps:
      - name: Keep git from rewriting line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # .nvmrc is the pin, for the same reason rust-toolchain.toml is: the
      # version is decided in the repository, not in this file. The lockfile is
      # at the root because `apps/desktop` and `packages/*` are one npm
      # workspace - a single resolution for all three, so the interface and the
      # component library cannot end up with two copies of React.
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # `npm ci` rather than `npm install`, so the lockfile is honoured exactly
      # and CI cannot quietly resolve a different dependency tree to the one a
      # contributor tested against.
      - name: Install dependencies
        run: npm ci

      # eslint, prettier and tsc. The three are one script so that a contributor
      # and this job cannot disagree about what "lint" means.
      #
      # `tsc` is also half of the protocol check below: the descriptors in
      # conformance.test.ts are mapped types over the interfaces they describe,
      # so a field added to the TypeScript and left out of its descriptor fails
      # here rather than there.
      - name: Lint
        run: npm run lint

      # packages/shared/src/ipc mirrors the recorder control protocol by hand
      # (docs/ipc.md, "The TypeScript types"). This is what stops it drifting:
      # it holds those types against packages/shared/src/ipc/protocol-schema.json,
      # which crates/ipc derives from the Rust types themselves - field names and
      # optionality from serde, and the verdict on every sample frame from the
      # real deserialiser.
      #
      # It runs inside `npm test` as well. It is named separately here so that
      # "the interface and the recorder disagree about the protocol" is legible
      # as that in the checks list, rather than as one failing assertion inside
      # "Test".
      #
      # The other half runs in the `rust` job as part of `cargo test`:
      # `the_committed_schema_is_the_one_this_build_produces` insists the
      # committed schema is still what the Rust types produce. Neither half is
      # enough on its own - this one would happily agree with a schema nobody
      # had regenerated.
      - name: Check the TypeScript protocol types against the Rust ones
        run: npm test --workspace @clipped/desktop -- ipc/conformance

      - name: Test
        run: npm test

      # Produces apps/desktop/dist, which the Tauri crate's build script
      # requires: `frontendDist` has to exist before `cargo` is run below, so
      # this step cannot move after it.
      - name: Build
        run: npm run build

      # The Tauri crate is deliberately not a member of the Cargo workspace
      # (apps/desktop/src-tauri/Cargo.toml says why), so the `rust` job's
      # `cargo fmt --all` and `cargo clippy --workspace` do not reach it. These
      # two steps are what keeps it to the same standard as the rest.
      - name: Restore the cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Check the desktop crate's formatting
        run: cargo fmt --all --check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Lint the desktop crate
        run: cargo clippy --all-targets --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

      # The rules the tray is built from live in this crate — what the menu
      # offers, what is disabled and why, and what the icon looks like for each
      # state (issue #50). `cargo clippy --all-targets` compiles those tests and
      # never runs them, and a test that is only compiled has stopped being a
      # test. Nothing here needs a display: the tray's model is a pure function
      # and the icon is bytes.
      - name: Test the desktop crate
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
